<!DOCTYPE html>
<html lang="sq">
<head>

<style>
*{box-sizing:border-box}
:root{
  --navy:#073f63;--blue:#087fa8;--cyan:#13a6c7;--teal:#0d8fae;
  --ink:#173f59;--muted:#6d8492;--line:#d8e6ed;--white:#fff;
}
html,body{min-height:100%}
body{
  margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);
  background:#dbeaf1 url("hospital-bg.png") center top/cover fixed no-repeat;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(238,247,251,.95) 0%,rgba(238,247,251,.82) 35%,rgba(221,239,247,.60) 100%);
}
.app-shell{min-height:100vh;display:flex}
.sidebar{
  width:230px;flex:0 0 230px;background:rgba(247,252,255,.94);
  border-right:1px solid rgba(181,207,220,.8);padding:22px 14px;
  display:flex;flex-direction:column;box-shadow:4px 0 18px rgba(7,63,99,.08)
}
.brand-mini{padding:4px 12px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand-mini strong{display:block;color:var(--navy);font-size:18px;letter-spacing:.3px}
.brand-mini span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.nav-item{
  display:flex;align-items:center;gap:13px;padding:13px 14px;margin:3px 0;
  border-radius:9px;color:#174e6c;font-weight:700;font-size:14px
}
.nav-item{width:100%;border:0;background:transparent;text-align:left;font-family:inherit;cursor:pointer}.nav-item:hover{background:#edf6fa}.nav-item.disabled{opacity:.52;cursor:default}.nav-item.disabled:hover{background:transparent}.nav-icon{width:22px;text-align:center;font-size:18px}
.nav-item.active{background:#dceff7;color:#087aa1;border-left:3px solid var(--cyan)}
.nav-icon{width:24px;text-align:center;font-size:18px}
.sidebar-footer{margin-top:auto;padding:14px 12px;color:#78909e;font-size:11px;line-height:1.6}
.main{flex:1;min-width:0;padding:20px 26px 42px}
.topbar{
  max-width:1200px;margin:0 auto 18px;background:rgba(255,255,255,.94);
  border:1px solid rgba(205,224,233,.9);border-radius:12px;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 5px 18px rgba(7,63,99,.07)
}
.hospital-logo{display:flex;align-items:center;gap:13px}
.logo-mark{
  width:48px;height:48px;border-radius:11px;background:linear-gradient(135deg,#0b8aaa,#08738f);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800
}
.logo-names{display:flex;align-items:center;gap:20px}
.hospital-name,.ambulatory-name{font-weight:850;color:var(--navy);letter-spacing:.3px;line-height:1}
.hospital-name{font-size:24px}.ambulatory-name{font-size:24px}
.logo-divider{width:1px;height:27px;background:#b8ccd6}
.top-date{font-size:14px;color:#486979;font-weight:650}
.content{max-width:1200px;margin:0 auto}
.page-heading{display:flex;align-items:end;justify-content:space-between;margin:12px 2px 14px}
.page-heading h1{margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,45,75,.28);font-size:25px}
.page-heading .date-title{margin:0;color:#eef9fd;font-size:13px;font-weight:650;text-shadow:0 1px 6px #315e70}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{
 background:rgba(255,255,255,.94);border:1px solid rgba(208,225,233,.95);border-radius:12px;
 padding:15px 16px;box-shadow:0 5px 16px rgba(7,63,99,.07);display:flex;align-items:center;gap:13px
}
.stat-icon{width:42px;height:42px;border-radius:10px;background:#e3f3f8;color:#0781a7;display:flex;align-items:center;justify-content:center;font-size:20px}
.stat-label{font-size:12px;color:#6b8290;font-weight:700}.stat-value{font-size:23px;font-weight:850;color:var(--navy);margin-top:2px}
.workspace{display:grid;grid-template-columns:minmax(310px,.82fr) minmax(500px,1.35fr);gap:14px}
.card{
 background:rgba(255,255,255,.95);padding:22px;border:1px solid rgba(207,225,233,.95);
 border-radius:13px;box-shadow:0 7px 20px rgba(7,63,99,.08);margin:0
}
.card-title{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--navy);font-size:18px;font-weight:850}
.card-title .title-icon{color:var(--cyan)}
label{display:block;font-weight:700;font-size:13px;color:#365b6e;margin-bottom:6px}
input,select{
 width:100%;height:44px;margin-bottom:14px;padding:9px 12px;border:1px solid #c9dbe4;
 border-radius:8px;font-size:15px;background:#fff;color:#173f59
}
input:focus,select:focus{outline:none;border-color:#13a6c7;box-shadow:0 0 0 3px rgba(19,166,199,.12)}
button{
 width:100%;height:44px;border:0;border-radius:8px;background:linear-gradient(135deg,#0b8aaa,#08738f);
 color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 9px rgba(8,115,143,.2)
}
button:hover{filter:brightness(.96)}
#paymentBox{display:none;margin-bottom:14px;padding:12px 13px;background:#f4fafc;border:1px solid var(--line);border-radius:8px}
.payment-option{display:flex;align-items:center;gap:8px;margin:7px 0;font-weight:600;font-size:13px}
.payment-option input{width:16px;height:16px;margin:0;accent-color:var(--cyan)}
#message{display:none;margin-bottom:12px;padding:10px 13px;border-radius:8px;text-align:center;font-weight:700;font-size:13px}
.message-success{display:block!important;background:#eaf8f0;color:#17663e;border:1px solid #b9dfc7}
.message-error{display:block!important;background:#fff1f1;color:#9e3030;border:1px solid #e6bcbc}
.agenda-card{min-height:520px}
.agenda-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.agenda-head h2{margin:0;color:var(--navy);font-size:18px}
.agenda-date{font-size:12px;color:#67818f;font-weight:700}
#visits{display:flex;flex-direction:column;gap:7px}
.agenda-slot{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:stretch;min-height:58px}
.slot-time{display:flex;align-items:center;justify-content:center;color:#557381;font-size:13px;font-weight:850;background:#f1f7f9;border:1px solid #dce8ed;border-radius:8px}
.slot-body{display:flex;align-items:center;min-width:0;border:1px solid #e0ebf0;border-radius:8px;background:#fbfdfe;padding:9px 11px}
.slot-empty{color:#9aaeb8;font-size:12px}
.slot-visit{display:grid;grid-template-columns:minmax(130px,1.1fr) 130px 170px 90px;gap:10px;align-items:center;width:100%;border-left:4px solid #16a5c4}
.slot-visit.control{border-left-color:#726bd8}
.visit-name{font-weight:800;color:#244f66;font-size:14px}
.visit-line{font-size:11px;color:#78909e;margin-top:3px}
.statusLine{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.visit-type,.payment-paid,.payment-free{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
.visit-type{background:#e4f3fa;color:#087aa1}
.payment-paid{background:#fff1d7;color:#996000}
.payment-free{background:#dff6eb;color:#17734b}
.delete-button{height:32px;font-size:11px;background:#f4f7f8;color:#8c4b4b;box-shadow:none;border:1px solid #e2e8eb}
.delete-button:hover{background:#fdecec}
.empty,.loading{padding:28px;text-align:center;background:#f8fbfc;border:1px dashed #cbdde5;border-radius:9px;color:#748d9a;font-size:13px}
@media(max-width:1050px){
 .sidebar{width:190px;flex-basis:190px}.workspace{grid-template-columns:1fr}.agenda-slot{grid-template-columns:58px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
 .app-shell{display:block}.sidebar{width:100%;display:block;padding:10px 12px}.brand-mini{display:none}
 .sidebar-footer{display:none}.nav-item{display:inline-flex;margin:2px;font-size:12px;padding:9px}
 .main{padding:10px 12px 30px}.topbar{padding:12px;display:block}
 .logo-names{gap:8px;flex-wrap:wrap}.hospital-name,.ambulatory-name{font-size:18px}.logo-divider{display:none}
 .top-date{margin-top:8px}.stats{grid-template-columns:1fr 1fr}.visit-item{grid-template-columns:55px 1fr 1fr}
 .visit-line{display:none}.slot-visit{grid-template-columns:1fr auto}.slot-visit .statusLine{grid-column:1}.slot-visit > div:last-child{grid-column:2}.delete-button{grid-column:auto}
}
@media(max-width:480px){
 .stats{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.agenda-slot{grid-template-columns:58px minmax(0,1fr)}
 .hospital-logo{align-items:flex-start}.logo-mark{width:42px;height:42px;font-size:24px}
}
</style>

<body>

<div class="app-shell">
  <aside class="sidebar">

          <div class="logo-divider"></div>

    <div class="content">

<div class="date-navigation">

<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

console.log("AMBULATORI GVM: Supabase client u inicializua");


/* =========================================================
   ELEMENTET
========================================================= */

const patientName =
    document.getElementById("patientName");

const cardNumber =
    document.getElementById("cardNumber");

const visitType =
    document.getElementById("visitType");

const paymentBox =
    document.getElementById("paymentBox");

const appointmentTime =
    document.getElementById("appointmentTime");

const saveButton =
    document.getElementById("saveButton");

const visits =
    document.getElementById("visits");

const message =
    document.getElementById("message");

const todayDate =
    document.getElementById("todayDate");


/* =========================================================
   DATA E SOTME
========================================================= */

let selectedDate = new Date();

function formatDateISO(date){
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2,"0");
    const day = String(date.getDate()).padStart(2,"0");
    return year + "-" + month + "-" + day;
}

function isToday(date){
    const now = new Date();
    return formatDateISO(date) === formatDateISO(now);
}


/* =========================================================
   SHFAQ DATEN
========================================================= */

function showSelectedDate(){
    const formatted = selectedDate.toLocaleDateString(
        "sq-AL",
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

    todayDate.textContent = formatted;

    const label = document.getElementById("selectedDateLabel");
    const iso = document.getElementById("selectedDateIso");

    if(label){
        label.textContent = formatted;
    }

    if(iso){
        iso.textContent = formatDateISO(selectedDate);
    }
}


/* =========================================================
   KRIJO ORARET
========================================================= */

function createTimeOptions(){

    appointmentTime.innerHTML =
        '<option value="">Zgjidh orën</option>';

    for(
        let hour = 12;
        hour <= 17;
        hour++
    ){

        for(
            let minute = 0;
            minute < 60;
            minute += 15
        ){

            if(
                hour === 17 &&
                minute > 0
            ){
                continue;
            }

            const time =
                String(hour).padStart(2,"0")
                +
                ":"
                +
                String(minute).padStart(2,"0");

            const option =
                document.createElement("option");

            option.value =
                time;

            option.textContent =
                time;

            appointmentTime.appendChild(
                option
            );
        }
    }

}


/* =========================================================
   SHOW / HIDE PAGESEN
========================================================= */

visitType.addEventListener(
    "change",
    function(){

        if(
            visitType.value ===
            "Rikontroll"
        ){

            paymentBox.style.display =
                "block";

        }
        else{

            paymentBox.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="payment"]'
                )
                .forEach(
                    function(radio){
                        radio.checked =
                            false;
                    }
                );
        }

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "";

    if(type === "success"){

        message.classList.add(
            "message-success"
        );

    }
    else{

        message.classList.add(
            "message-error"
        );

    }

    setTimeout(
        function(){

            message.style.display =
                "none";

            message.className =
                "";

        },
        5000
    );

}


/* =========================================================
   RUAJ VIZITEN
========================================================= */

async function saveVisit(){

    const name =
        patientName.value.trim();

    const card =
        cardNumber.value.trim();

    const type =
        visitType.value;

    const time =
        appointmentTime.value;

    let payment =
        null;


    /* VALIDIM */

    if(!name){

        showMessage(
            "Vendos Emër Mbiemër.",
            "error"
        );

        patientName.focus();

        return;
    }


    if(!time){

        showMessage(
            "Zgjidh orën e vizitës.",
            "error"
        );

        appointmentTime.focus();

        return;
    }


    /* PAGESA VETEM PER RIKONTROLL */

    if(type === "Rikontroll"){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );

        if(!selectedPayment){

            showMessage(
                "Zgjidh Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }

        payment =
            selectedPayment.value;

    }


    const date =
        formatDateISO(selectedDate);


    /* DISABLE BUTTON */

    saveButton.disabled =
        true;

    saveButton.textContent =
        "Po ruhet...";


    console.log(
        "Po ruhet vizita:",
        {
            appointment_date:date,
            appointment_time:time,
            patient_name:name,
            card_number:card || null,
            visit_type:type,
            payment_status:payment
        }
    );


    /* INSERT SUPABASE */

    let result;

    try {
        result = await db
            .from("appointments")
            .insert({
                appointment_date: date,
                appointment_time: time,
                patient_name: name,
                card_number: card || null,
                visit_type: type,
                payment_status: payment,
                status: "scheduled"
            });
    } catch (err) {
        console.error("SUPABASE INSERT EXCEPTION:", err);
        showMessage(
            "Gabim gjatë ruajtjes: " + (err.message || err),
            "error"
        );
        saveButton.disabled = false;
        saveButton.textContent = "Ruaj Vizitën";
        return;
    }

    console.log("Supabase result:", result);


    /* GABIM */

    if(result.error){

        console.error(
            "SUPABASE INSERT ERROR:",
            result.error
        );

        showMessage(
            "Gabim Supabase: " +
            result.error.message,
            "error"
        );

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Ruaj Vizitën";

        return;
    }


    /* SUKSES */

    showMessage(
        "Vizita u ruajt me sukses.",
        "success"
    );


    /* PASTRO FORMULAREN */

    patientName.value =
        "";

    cardNumber.value =
        "";

    appointmentTime.value =
        "";

    visitType.value =
        "Vizitë";

    paymentBox.style.display =
        "none";


    document
        .querySelectorAll(
            'input[name="payment"]'
        )
        .forEach(
            function(radio){

                radio.checked =
                    false;

            }
        );


    saveButton.disabled =
        false;

    saveButton.textContent =
        "Ruaj Vizitën";


    /* RINGARKO LISTEN */

    await loadVisits();

}


/* =========================================================
   NGARKO VIZITAT E SOTME
========================================================= */

async function loadVisits(){

    visits.innerHTML =
        '<div class="loading">Po ngarkohen vizitat...</div>';

    const date =
        formatDateISO(selectedDate);

    const result =
        await db
            .from("appointments")
            .select(
                "id, appointment_date, appointment_time, patient_name, card_number, visit_type, payment_status, status"
            )
            .eq(
                "appointment_date",
                date
            )
            .order(
                "appointment_time",
                {
                    ascending:true
                }
            );

    if(result.error){

        console.error(
            "SUPABASE SELECT ERROR:",
            result.error
        );

        visits.innerHTML =
            "<div class=\"empty\"><strong>Gabim gjatë ngarkimit</strong><br><br>" +
            result.error.message +
            "</div>";

        return;
    }

    const data =
        result.data || [];

    if(data.length === 0){

        visits.innerHTML =
            '<div class="empty">Nuk ka vizita të regjistruara për këtë datë.</div>';

        return;
    }

    visits.innerHTML = "";

    data.forEach(function(visit){

        const item =
            document.createElement("div");

        item.className =
            "visit-item";

        const currentStatus =
            visit.status || "scheduled";

        let statusLabel = "Në pritje";
        let statusClass = "";

        if(currentStatus === "arrived"){
            statusLabel = "Ka ardhur";
            statusClass = "arrived";
        }
        else if(currentStatus === "finished"){
            statusLabel = "Ka mbaruar";
            statusClass = "finished";
        }
        else if(currentStatus === "cancelled"){
            statusLabel = "Anulluar";
            statusClass = "cancelled";
        }

        if(statusClass){
            item.classList.add(
                "status-" + statusClass
            );
        }

        const time =
            document.createElement("div");

        time.className =
            "visit-time";

        time.textContent =
            visit.appointment_time
                ? String(visit.appointment_time).substring(0,5)
                : "--:--";

        const name =
            document.createElement("div");

        name.className =
            "visit-name";

        name.textContent =
            visit.patient_name || "";

        const card =
            document.createElement("div");

        card.className =
            "visit-line";

        card.innerHTML =
            "<strong>Nr. Kartelës:</strong> " +
            (visit.card_number || "—");

        const statusLine =
            document.createElement("div");

        const type =
            document.createElement("span");

        type.className =
            "visit-type";

        type.textContent =
            visit.visit_type || "Vizitë";

        statusLine.appendChild(type);

        if(visit.visit_type === "Rikontroll"){

            const payment =
                document.createElement("span");

            if(visit.payment_status === "Me pagesë"){
                payment.className = "payment-paid";
                payment.textContent = "Me pagesë";
            }
            else if(visit.payment_status === "Pa pagesë"){
                payment.className = "payment-free";
                payment.textContent = "Pa pagesë";
            }
            else{
                payment.className = "payment-paid";
                payment.textContent = "Pagesa nuk është zgjedhur";
            }

            statusLine.appendChild(payment);
        }

        const badge =
            document.createElement("span");

        badge.className =
            "status-badge " + statusClass;

        badge.textContent =
            statusLabel;

        statusLine.appendChild(badge);

        const controls =
            document.createElement("div");

        controls.className =
            "visit-status-controls";

        const arrived =
            document.createElement("button");

        arrived.type = "button";
        arrived.className =
            "visit-status-button arrived" +
            (currentStatus === "arrived" ? " active" : "");
        arrived.textContent =
            "✓ Ka ardhur";

        arrived.addEventListener("click", function(){
            updateVisitStatus(
                visit.id,
                "arrived"
            );
        });

        const finished =
            document.createElement("button");

        finished.type = "button";
        finished.className =
            "visit-status-button finished" +
            (currentStatus === "finished" ? " active" : "");
        finished.textContent =
            "✓ Ka mbaruar";

        finished.addEventListener("click", function(){
            updateVisitStatus(
                visit.id,
                "finished"
            );
        });

        const cancelled =
            document.createElement("button");

        cancelled.type = "button";
        cancelled.className =
            "visit-status-button cancelled" +
            (currentStatus === "cancelled" ? " active" : "");
        cancelled.textContent =
            "Anullo";

        cancelled.addEventListener("click", function(){
            updateVisitStatus(
                visit.id,
                "cancelled"
            );
        });

        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className =
            "visit-delete-button";
        deleteButton.textContent =
            "Fshi vizitën";

        deleteButton.addEventListener("click", function(){
            deleteVisit(visit.id);
        });

        controls.appendChild(arrived);
        controls.appendChild(finished);
        controls.appendChild(cancelled);
        controls.appendChild(deleteButton);

        item.appendChild(time);
        item.appendChild(name);
        item.appendChild(card);
        item.appendChild(statusLine);
        item.appendChild(controls);

        visits.appendChild(item);
    });
}


/* =========================================================
   STATUSI DHE FSHIRJA
========================================================= */

async function updateVisitStatus(id, status){

    const result =
        await db
            .from("appointments")
            .update({
                status: status
            })
            .eq("id", id);

    if(result.error){

        showMessage(
            "Gabim gjatë ndryshimit të statusit: " +
            result.error.message,
            "error"
        );

        return;
    }

    await loadVisits();
}


async function deleteVisit(id){

    const confirmed =
        confirm(
            "A dëshiron ta fshish këtë vizitë? Ky veprim nuk mund të zhbëhet."
        );

    if(!confirmed){
        return;
    }

    const result =
        await db
            .from("appointments")
            .delete()
            .eq("id", id);

    if(result.error){

        showMessage(
            "Gabim gjatë fshirjes: " +
            result.error.message,
            "error"
        );

        return;
    }

    showMessage(
        "Vizita u fshi.",
        "success"
    );

    await loadVisits();
}


/* =========================================================
   NAVIGIMI I DATËS
========================================================= */

function changeDate(days){
    const next = new Date(selectedDate);
    next.setDate(next.getDate() + days);
    selectedDate = next;

    showSelectedDate();
    loadVisits();
}

document.getElementById("prevDate").addEventListener(
    "click",
    function(){
        changeDate(-1);
    }
);

document.getElementById("nextDate").addEventListener(
    "click",
    function(){
        changeDate(1);
    }
);

document.getElementById("todayButton").addEventListener(
    "click",
    function(){
        selectedDate = new Date();
        showSelectedDate();
        loadVisits();
    }
);


/* =========================================================
   START
========================================================= */

showSelectedDate();

createTimeOptions();

loadVisits();

</script>
