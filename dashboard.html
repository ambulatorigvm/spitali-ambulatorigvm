<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMBULATORI GVM</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    margin:0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#155e75;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

input,
select{
    width:100%;
    height:45px;
    margin-bottom:10px;
    padding:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    height:45px;
    border:none;
    background:#0891b2;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0e7490;
}

#paymentBox{
    display:none;
    margin-bottom:10px;
    padding:10px;
    background:#f8fafc;
    border:1px solid #ddd;
    border-radius:8px;
}

.visit-item{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    border-left:5px solid #2196f3;
}

</style>
</head>
<body>

<div class="container">

<h1>AMBULATORI GVM</h1>

<div class="card">

<input
type="text"
id="patientName"
placeholder="Emër Mbiemër">

<input
type="text"
id="cardNumber"
placeholder="Nr. Kartelës">

<select id="visitType">
<option value="Vizitë">Vizitë</option>
<option value="Rikontroll">Rikontroll</option>
</select>

<div id="paymentBox">

<label>
<input type="radio" name="payment" value="Me pagesë">
Me pagesë
</label>

<br><br>

<label>
<input type="radio" name="payment" value="Pa pagesë">
Pa pagesë
</label>

</div>

<select id="appointmentTime">
<option value="">Zgjidh orën</option>
</select>

<button onclick="saveVisit()">
Ruaj Vizitën
</button>

</div>

<h2>Vizitat e ditës</h2>

<div id="visits"></div>

</div>

<script>

const visitType =
document.getElementById("visitType");

const paymentBox =
document.getElementById("paymentBox");

visitType.addEventListener("change",()=>{

    if(visitType.value==="Rikontroll"){
        paymentBox.style.display="block";
    }else{
        paymentBox.style.display="none";
    }

});

const timeSelect =
document.getElementById("appointmentTime");

for(let h=12;h<=17;h++){

    for(let m=0;m<60;m+=15){

        if(h===17 && m>0){
            continue;
        }

        const time =
        String(h).padStart(2,"0")
        + ":"
        +
        String(m).padStart(2,"0");

        const option =
        document.createElement("option");

        option.value=time;
        option.textContent=time;

        timeSelect.appendChild(option);
    }
}

function saveVisit(){

    const patientName =
    document.getElementById("patientName").value;

    const cardNumber =
    document.getElementById("cardNumber").value;

    const visitTypeValue =
    document.getElementById("visitType").value;

    const appointmentTime =
    document.getElementById("appointmentTime").value;

    if(!patientName){
        alert("Vendos emrin");
        return;
    }

    if(!appointmentTime){
        alert("Zgjidh orën");
        return;
    }

    const visit =
    document.createElement("div");

    visit.className =
    "visit-item";

    visit.innerHTML = `
        <strong>${appointmentTime}</strong><br>
        ${patientName}<br>
        Kartela: ${cardNumber}<br>
        ${visitTypeValue}
    `;

    document
    .getElementById("visits")
    .appendChild(visit);

    document
    .getElementById("patientName")
    .value="";

    document
    .getElementById("cardNumber")
    .value="";

    document
    .getElementById("appointmentTime")
    .value="";
}

</script>

</body>
</html>
