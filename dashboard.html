<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GVM Care & Research</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:#eef5f8;
    color:#183b4b;
}

/* =========================
   BACKGROUND
========================= */

.page{
    min-height:100vh;
    background:
        linear-gradient(
            rgba(8,45,65,.72),
            rgba(8,45,65,.58)
        ),
        url("https://www.gvm-international.com/gvminternational/files/32/32a230c1-e50a-4720-8572-99addb366ef9.jpg")
        center/cover fixed no-repeat;
    padding:30px;
}

/* =========================
   HEADER
========================= */

.header{
    max-width:1400px;
    margin:0 auto 25px auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:22px 28px;

    background:rgba(255,255,255,.94);
    border-radius:22px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.18);
}

.brand{
    display:flex;
    align-items:center;
    gap:16px;
}

.logo{
    width:58px;
    height:58px;
    border-radius:16px;

    background:#087ca5;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:24px;
    font-weight:bold;

    box-shadow:0 7px 18px rgba(0,120,160,.25);
}

.brand h1{
    color:#087ca5;
    font-size:27px;
    letter-spacing:.3px;
}

.brand span{
    display:block;
    margin-top:4px;
    color:#71828a;
    font-size:13px;
}

.clock{
    text-align:right;
}

.clock strong{
    display:block;
    color:#087ca5;
    font-size:20px;
}

.clock span{
    color:#71828a;
    font-size:13px;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1400px;
    margin:auto;

    display:grid;
    grid-template-columns:370px 1fr;
    gap:25px;
}

/* =========================
   CARDS
========================= */

.card{
    background:rgba(255,255,255,.96);
    border-radius:22px;
    padding:25px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.16);
}

.card-title{
    font-size:20px;
    font-weight:bold;
    color:#087ca5;
    margin-bottom:20px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#536a73;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px 14px;

    border:1px solid #d8e4e8;
    border-radius:12px;

    outline:none;

    font-size:14px;
    color:#244653;

    background:#fbfdfe;

    transition:.2s;
}

input:focus,
select:focus{
    border-color:#0783ac;
    box-shadow:0 0 0 3px rgba(8,131,172,.10);
}

.form-group{
    margin-bottom:17px;
}

/* =========================
   PATIENT SEARCH
========================= */

.search-box{
    position:relative;
}

.patient-results{
    margin-top:7px;
    max-height:190px;
    overflow:auto;

    border-radius:12px;
}

.patient-item{
    background:#f5fafc;
    border:1px solid #e0ecef;

    padding:11px 13px;

    cursor:pointer;

    border-radius:10px;
    margin-bottom:5px;
}

.patient-item:hover{
    background:#e8f5f9;
}

.patient-item strong{
    display:block;
    color:#17647d;
}

.patient-item small{
    color:#74868d;
}

/* =========================
   VISIT TYPE
========================= */

.visit-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.visit-option{
    border:1px solid #d6e3e7;
    border-radius:12px;
    padding:13px;

    text-align:center;
    cursor:pointer;

    background:#fafcfd;
}

.visit-option input{
    display:none;
}

.visit-option.active{
    border-color:#0783ac;
    background:#e8f7fb;
    color:#087ca5;
    font-weight:bold;
}

/* =========================
   PAYMENT
========================= */

.payment-box{
    margin-top:12px;
    padding:13px;

    background:#f5fafc;
    border-radius:13px;

    border:1px solid #dce9ed;
}

.payment-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.payment-option{
    padding:10px;
    border-radius:10px;

    border:1px solid #d8e4e8;
    text-align:center;

    cursor:pointer;
    font-size:13px;
}

.payment-option.active{
    background:#087ca5;
    color:white;
    border-color:#087ca5;
}

/* =========================
   BUTTON
========================= */

.btn{
    width:100%;
    border:none;

    padding:14px;

    border-radius:13px;

    background:linear-gradient(
        135deg,
        #087ca5,
        #0b9bbd
    );

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 18px rgba(8,124,165,.25);
}

.btn:hover{
    transform:translateY(-1px);
}

.message{
    margin-top:12px;
    text-align:center;
    font-size:13px;
}

/* =========================
   AGENDA
========================= */

.agenda-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.date-controls{
    display:flex;
    gap:8px;
}

.date-controls button{
    border:none;
    background:#edf7fa;
    color:#087ca5;

    border-radius:10px;

    padding:9px 12px;

    cursor:pointer;
    font-weight:bold;
}

.date-title{
    text-align:center;
}

.date-title strong{
    display:block;
    color:#087ca5;
    font-size:20px;
}

.date-title span{
    color:#73868e;
    font-size:13px;
}

.schedule{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.slot{
    min-height:66px;

    display:grid;
    grid-template-columns:75px 1fr;

    border:1px solid #e0eaed;
    border-radius:14px;

    overflow:hidden;

    background:white;
}

.time{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#f1f8fa;

    font-weight:bold;
    color:#087ca5;

    font-size:14px;
}

.appointment{
    padding:10px 15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-left:4px solid #d8e5e8;
}

.appointment.vizite{
    border-left-color:#1995ba;
}

.appointment.rikontroll{
    border-left-color:#7c68c9;
}

.patient-info strong{
    display:block;
    color:#244653;
    font-size:15px;
}

.patient-info small{
    display:block;
    margin-top:4px;
    color:#71848c;
}

.badge{
    display:inline-block;

    margin-left:8px;

    padding:5px 8px;

    border-radius:20px;

    font-size:11px;
    font-weight:bold;
}

.badge-vizite{
    background:#e7f6fb;
    color:#087ca5;
}

.badge-rikontroll{
    background:#eeeafb;
    color:#6a57ae;
}

.badge-paid{
    background:#e7f7ed;
    color:#23844c;
}

.badge-free{
    background:#fff3df;
    color:#a56a00;
}

.empty{
    color:#a1afb4;
    font-size:13px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .main{
        grid-template-columns:1fr;
    }

}

@media(max-width:650px){

    .page{
        padding:12px;
    }

    .header{
        padding:18px;
    }

    .brand h1{
        font-size:21px;
    }

    .clock{
        display:none;
    }

    .card{
        padding:18px;
    }

    .slot{
        grid-template-columns:65px 1fr;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                GVM
            </div>

            <div>
                <h1>GVM Care & Research</h1>
                <span>Medical Care & Appointment Management</span>
            </div>

        </div>

        <div class="clock">
            <strong id="clock">--:--</strong>
            <span id="todayLabel"></span>
        </div>

    </header>


    <!-- MAIN -->

    <main class="main">

        <!-- =========================
             NEW APPOINTMENT
        ========================== -->

        <section class="card">

            <div class="card-title">
                Planifiko një vizitë
            </div>


            <!-- PATIENT -->

            <div class="form-group">

                <label>Emër + Mbiemër</label>

                <div class="search-box">

                    <input
                        id="patientSearch"
                        type="text"
                        autocomplete="off"
                        placeholder="Kërko pacientin..."
                    >

                    <div
                        id="patientResults"
                        class="patient-results">
                    </div>

                </div>

            </div>


            <!-- CARD NUMBER -->

            <div class="form-group">

                <label>Nr. kartele</label>

                <input
                    id="cardNumber"
                    type="text"
                    placeholder="Nr. kartele"
                >

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>Data</label>

                <input
                    id="appointmentDate"
                    type="date"
                >

            </div>


            <!-- TIME -->

            <div class="form-group">

                <label>Orari</label>

                <select id="appointmentTime">

                    <option value="">Zgjidh orarin</option>

                    <option>12:00</option>
                    <option>12:15</option>
                    <option>12:30</option>
                    <option>12:45</option>

                    <option>13:00</option>
                    <option>13:15</option>
                    <option>13:30</option>
                    <option>13:45</option>

                    <option>14:00</option>
                    <option>14:15</option>
                    <option>14:30</option>
                    <option>14:45</option>

                    <option>15:00</option>
                    <option>15:15</option>
                    <option>15:30</option>
                    <option>15:45</option>

                    <option>16:00</option>
                    <option>16:15</option>
                    <option>16:30</option>
                    <option>16:45</option>

                    <option>17:00</option>

                </select>

            </div>


            <!-- VISIT TYPE -->

            <div class="form-group">

                <label>Lloji i vizitës</label>

                <div class="visit-options">

                    <label
                        class="visit-option"
                        id="visitBox"
                    >
                        <input
                            type="radio"
                            name="visitType"
                            value="Vizitë"
                        >
                        Vizitë
                    </label>

                    <label
                        class="visit-option"
                        id="controlBox"
                    >
                        <input
                            type="radio"
                            name="visitType"
                            value="Rikontroll"
                        >
                        Rikontroll
                    </label>

                </div>

            </div>


            <!-- PAYMENT -->

            <div
                id="paymentBox"
                class="payment-box"
                style="display:none;"
            >

                <label>Pagesa për rikontroll</label>

                <div class="payment-options">

                    <div
                        class="payment-option"
                        data-payment="Me pagesë"
                    >
                        Me pagesë
                    </div>

                    <div
                        class="payment-option"
                        data-payment="Pa pagesë"
                    >
                        Pa pagesë
                    </div>

                </div>

            </div>


            <button
                class="btn"
                id="saveButton"
                style="margin-top:18px;"
            >
                Ruaj vizitën
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </section>


        <!-- =========================
             AGENDA
        ========================== -->

        <section class="card">

            <div class="agenda-header">

                <div class="date-controls">

                    <button id="prevDay">
                        ‹
                    </button>

                    <button id="todayButton">
                        Sot
                    </button>

                    <button id="nextDay">
                        ›
                    </button>

                </div>

                <div class="date-title">

                    <strong id="agendaDate">
                        —
                    </strong>

                    <span>
                        Agjenda ditore
                    </span>

                </div>

                <div style="width:105px;"></div>

            </div>


            <div
                id="schedule"
                class="schedule"
            ></div>

        </section>

    </main>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let selectedPatient = null;

let selectedPayment = null;

let currentDate =
    new Date();


/* =====================================================
   ELEMENTS
===================================================== */

const patientSearch =
    document.getElementById("patientSearch");

const patientResults =
    document.getElementById("patientResults");

const cardNumber =
    document.getElementById("cardNumber");

const appointmentDate =
    document.getElementById("appointmentDate");

const appointmentTime =
    document.getElementById("appointmentTime");

const paymentBox =
    document.getElementById("paymentBox");

const message =
    document.getElementById("message");

const schedule =
    document.getElementById("schedule");


/* =====================================================
   DATE
===================================================== */

function dateToISO(date){

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(date.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function formatDate(date){

    return date.toLocaleDateString(
        "sq-AL",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );
}


function setCurrentDate(){

    appointmentDate.value =
        dateToISO(currentDate);

    document.getElementById(
        "agendaDate"
    ).textContent =
        formatDate(currentDate);

    loadAppointments();
}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();

    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            "sq-AL",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById(
        "todayLabel"
    ).textContent =
        now.toLocaleDateString(
            "sq-AL",
            {
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );
}

setInterval(updateClock,1000);
updateClock();


/* =====================================================
   PATIENT SEARCH
===================================================== */

let searchTimer;

patientSearch.addEventListener(
    "input",
    function(){

        clearTimeout(searchTimer);

        const value =
            this.value.trim();

        selectedPatient = null;

        if(value.length < 2){

            patientResults.innerHTML = "";

            return;
        }

        searchTimer =
            setTimeout(
                () => searchPatients(value),
                250
            );
    }
);


async function searchPatients(value){

    patientResults.innerHTML =
        "<div class='patient-item'>Po kërkoj...</div>";

    const { data, error } =
        await supabaseClient
            .from("patients")
            .select("full_name,card_number")
            .or(
                `full_name.ilike.%${value}%,card_number.ilike.%${value}%`
            )
            .limit(20);

    if(error){

        patientResults.innerHTML =
            "<div class='patient-item'>Gabim gjatë kërkimit.</div>";

        console.error(error);

        return;
    }

    if(!data || data.length === 0){

        patientResults.innerHTML =
            "<div class='patient-item'>Nuk u gjet pacient.</div>";

        return;
    }

    patientResults.innerHTML = "";

    data.forEach(patient => {

        const div =
            document.createElement("div");

        div.className =
            "patient-item";

        div.innerHTML = `
            <strong>
                ${escapeHtml(patient.full_name || "")}
            </strong>

            <small>
                Nr. kartele:
                ${escapeHtml(patient.card_number || "—")}
            </small>
        `;

        div.addEventListener(
            "click",
            () => {

                selectedPatient =
                    patient;

                patientSearch.value =
                    patient.full_name || "";

                cardNumber.value =
                    patient.card_number || "";

                patientResults.innerHTML =
                    "";

            }
        );

        patientResults.appendChild(div);

    });
}


/* =====================================================
   VISIT TYPE
===================================================== */

document.querySelectorAll(
    'input[name="visitType"]'
).forEach(input => {

    input.addEventListener(
        "change",
        function(){

            document.querySelectorAll(
                ".visit-option"
            ).forEach(box =>
                box.classList.remove("active")
            );

            this.closest(
                ".visit-option"
            ).classList.add("active");


            if(this.value === "Rikontroll"){

                paymentBox.style.display =
                    "block";

            }else{

                paymentBox.style.display =
                    "none";

                selectedPayment =
                    null;

                document.querySelectorAll(
                    ".payment-option"
                ).forEach(x =>
                    x.classList.remove("active")
                );
            }

        }
    );

});


/* =====================================================
   PAYMENT
===================================================== */

document.querySelectorAll(
    ".payment-option"
).forEach(option => {

    option.addEventListener(
        "click",
        function(){

            selectedPayment =
                this.dataset.payment;

            document.querySelectorAll(
                ".payment-option"
            ).forEach(x =>
                x.classList.remove("active")
            );

            this.classList.add("active");

        }
    );

});


/* =====================================================
   SAVE APPOINTMENT
===================================================== */

document.getElementById(
    "saveButton"
).addEventListener(
    "click",
    saveAppointment
);


async function saveAppointment(){

    message.textContent = "";
    message.style.color = "#c0392b";


    const name =
        patientSearch.value.trim();

    const card =
        cardNumber.value.trim();

    const date =
        appointmentDate.value;

    const time =
        appointmentTime.value;

    const visit =
        document.querySelector(
            'input[name="visitType"]:checked'
        );


    if(!name){

        message.textContent =
            "Zgjidh pacientin.";

        return;
    }

    if(!date){

        message.textContent =
            "Zgjidh datën.";

        return;
    }

    if(!time){

        message.textContent =
            "Zgjidh orarin.";

        return;
    }

    if(!visit){

        message.textContent =
            "Zgjidh Vizitë ose Rikontroll.";

        return;
    }


    if(
        visit.value === "Rikontroll"
        &&
        !selectedPayment
    ){

        message.textContent =
            "Zgjidh Me pagesë ose Pa pagesë.";

        return;
    }


    const record = {

        appointment_date:
            date,

        appointment_time:
            time,

        patient_name:
            name,

        card_number:
            card || null,

        visit_type:
            visit.value,

        payment_status:
            visit.value === "Rikontroll"
                ? selectedPayment
                : null
    };


    const { error } =
        await supabaseClient
            .from("appointments")
            .insert(record);


    if(error){

        console.error(error);

        message.textContent =
            "Vizita nuk u ruajt: " +
            error.message;

        return;
    }


    message.style.color =
        "#23844c";

    message.textContent =
        "Vizita u ruajt me sukses.";

    appointmentTime.value =
        "";

    document.querySelectorAll(
        'input[name="visitType"]'
    ).forEach(x =>
        x.checked = false
    );

    document.querySelectorAll(
        ".visit-option"
    ).forEach(x =>
        x.classList.remove("active")
    );

    document.querySelectorAll(
        ".payment-option"
    ).forEach(x =>
        x.classList.remove("active")
    );

    paymentBox.style.display =
        "none";

    selectedPayment =
        null;

    await loadAppointments();

}


/* =====================================================
   AGENDA
===================================================== */

const times = [

    "12:00",
    "12:15",
    "12:30",
    "12:45",

    "13:00",
    "13:15",
    "13:30",
    "13:45",

    "14:00",
    "14:15",
    "14:30",
    "14:45",

    "15:00",
    "15:15",
    "15:30",
    "15:45",

    "16:00",
    "16:15",
    "16:30",
    "16:45",

    "17:00"

];


async function loadAppointments(){

    schedule.innerHTML =
        "";

    const date =
        dateToISO(currentDate);


    const { data, error } =
        await supabaseClient
            .from("appointments")
            .select(
                "id,appointment_date,appointment_time,patient_name,card_number,visit_type,payment_status"
            )
            .eq(
                "appointment_date",
                date
            )
            .order(
                "appointment_time",
                { ascending:true }
            );


    if(error){

        schedule.innerHTML =
            `<div class="empty">
                Gabim gjatë ngarkimit të agjendës.
             </div>`;

        console.error(error);

        return;
    }


    const appointments =
        data || [];


    times.forEach(time => {

        const slot =
            document.createElement("div");

        slot.className =
            "slot";


        const timeBox =
            document.createElement("div");

        timeBox.className =
            "time";

        timeBox.textContent =
            time;


        const appointmentBox =
            document.createElement("div");

        appointmentBox.className =
            "appointment";


        const appt =
            appointments.find(a =>
                normalizeTime(a.appointment_time)
                === time
            );


        if(!appt){

            appointmentBox.innerHTML =
                `<span class="empty">
                    Orari i lirë
                 </span>`;

        }else{

            const typeClass =
                appt.visit_type === "Rikontroll"
                    ? "rikontroll"
                    : "vizite";

            appointmentBox.classList.add(
                typeClass
            );


            let badges = "";

            if(appt.visit_type){

                badges += `
                    <span class="badge ${
                        appt.visit_type === "Rikontroll"
                            ? "badge-rikontroll"
                            : "badge-vizite"
                    }">
                        ${escapeHtml(appt.visit_type)}
                    </span>
                `;
            }


            if(appt.payment_status){

                badges += `
                    <span class="badge ${
                        appt.payment_status === "Me pagesë"
                            ? "badge-paid"
                            : "badge-free"
                    }">
                        ${escapeHtml(appt.payment_status)}
                    </span>
                `;
            }


            appointmentBox.innerHTML = `

                <div class="patient-info">

                    <strong>
                        ${escapeHtml(
                            appt.patient_name || ""
                        )}
                    </strong>

                    <small>
                        Nr. kartele:
                        ${
                            escapeHtml(
                                appt.card_number || "—"
                            )
                        }

                        ${badges}
                    </small>

                </div>

            `;

        }


        slot.appendChild(timeBox);

        slot.appendChild(appointmentBox);

        schedule.appendChild(slot);

    });

}


/* =====================================================
   TIME NORMALIZATION
===================================================== */

function normalizeTime(value){

    if(!value)
        return "";

    return String(value)
        .substring(0,5);
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   DATE NAVIGATION
===================================================== */

document.getElementById(
    "prevDay"
).addEventListener(
    "click",
    () => {

        currentDate.setDate(
            currentDate.getDate() - 1
        );

        setCurrentDate();

    }
);


document.getElementById(
    "nextDay"
).addEventListener(
    "click",
    () => {

        currentDate.setDate(
            currentDate.getDate() + 1
        );

        setCurrentDate();

    }
);


document.getElementById(
    "todayButton"
).addEventListener(
    "click",
    () => {

        currentDate =
            new Date();

        setCurrentDate();

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

setCurrentDate();

</script>
