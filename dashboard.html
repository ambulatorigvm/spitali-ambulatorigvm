<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMBULATORI GVM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#071923;
    color:#eaf4f8;
}


/* =========================================================
   APP
========================================================= */

.app{
    min-height:100vh;
    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:245px;
    min-width:245px;
    background:#06151d;
    border-right:1px solid rgba(255,255,255,.08);
    padding:24px 18px;
    color:white;
}

.brand{
    padding:8px 10px 25px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-main{
    font-size:20px;
    font-weight:800;
    letter-spacing:.6px;
}

.brand-sub{
    margin-top:5px;
    font-size:12px;
    color:#83a8b7;
    letter-spacing:1.2px;
}

.nav{
    margin-top:25px;
}

.nav-item{
    padding:13px 14px;
    border-radius:10px;
    color:#91aeb9;
    font-size:14px;
    margin-bottom:7px;
}

.nav-item.active{
    background:#0d394b;
    color:white;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    min-width:0;
    padding:20px;
    overflow-x:hidden;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.page-title{
    font-size:24px;
    font-weight:800;
    color:#f1f8fb;
}

.page-subtitle{
    margin-top:5px;
    color:#8ca5af;
    font-size:13px;
}

.user-box{
    background:#0c2631;
    border:1px solid #183b48;
    border-radius:12px;
    padding:10px 14px;
    font-size:12px;
    color:#a9c2cc;
}


/* =========================================================
   DATE NAVIGATION
========================================================= */

.date-navigation{
    background:#0b222d;
    border:1px solid #173a47;
    border-radius:14px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
}

.date-navigation button{
    border:1px solid #204655;
    background:#102f3c;
    color:#dcecf2;
    width:38px;
    height:38px;
    border-radius:9px;
    cursor:pointer;
    font-size:18px;
}

.date-navigation button:hover{
    background:#174354;
}

.date-center{
    text-align:center;
    flex:1;
}

.date-main{
    font-size:17px;
    font-weight:800;
    color:#eaf6fa;
}

.date-small{
    margin-top:3px;
    font-size:12px;
    color:#7896a2;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px;
}

.stat-card{
    background:#0b222d;
    border:1px solid #173a47;
    border-radius:14px;
    padding:15px;
}

.stat-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:#7896a2;
}

.stat-value{
    margin-top:7px;
    font-size:25px;
    font-weight:800;
    color:#eef9fc;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
    display:none;
    margin-bottom:15px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
}

.message.show{
    display:block;
}

.message.success{
    background:#0c3025;
    border:1px solid #1b684e;
    color:#8ce0bd;
}

.message.error{
    background:#35191c;
    border:1px solid #793036;
    color:#ffabb0;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    display:grid;

    /*
       FORMULARI = djathtas
       AGJENDA = majtas
    */
    grid-template-columns:
        minmax(0,1fr)
        minmax(320px,365px);

    gap:15px;

    align-items:start;
}


/* =========================================================
   CARDS
========================================================= */

.card{
    background:#0b222d;
    border:1px solid #173a47;
    border-radius:15px;
    padding:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.card-title{
    font-size:16px;
    font-weight:800;
    color:#eaf7fa;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:8px;
}

.title-icon{
    width:27px;
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#123a49;
    color:#75d1e8;
    border-radius:8px;
    font-size:17px;
}


/* =========================================================
   FORM
========================================================= */

label{
    display:block;
    margin:12px 0 6px;
    font-size:12px;
    font-weight:700;
    color:#91aeb9;
}

input[type="text"],
select{
    width:100%;
    height:42px;
    border:1px solid #234653;
    background:#071b24;
    border-radius:9px;
    padding:0 12px;
    color:#e9f5f8;
    outline:none;
    font-size:13px;
}

input[type="text"]:focus,
select:focus{
    border-color:#3298b5;
    box-shadow:0 0 0 3px rgba(50,152,181,.12);
}

#paymentBox{
    display:none;
    margin-top:12px;
    padding:12px;
    border:1px solid #234653;
    background:#081c25;
    border-radius:10px;

    position:relative;
    z-index:100;
}

#paymentBox label:first-child{
    margin-top:0;
}

.payment-option{
    display:flex;
    align-items:center;
    gap:8px;

    margin:8px 0;
    padding:8px;

    border-radius:7px;

    cursor:pointer;

    font-weight:600;
    color:#b9d0d8;

    position:relative;
    z-index:101;
}

.payment-option:hover{
    background:#102f3c;
}

.payment-option input{
    width:16px;
    height:16px;
    margin:0;
    cursor:pointer;
}

#saveButton{
    width:100%;
    height:44px;
    margin-top:20px;

    border:0;
    border-radius:10px;

    background:#0b7897;
    color:white;

    font-size:14px;
    font-weight:800;

    cursor:pointer;
}

#saveButton:hover{
    background:#0d8cad;
}

#saveButton:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================================================
   AGENDA
========================================================= */

.agenda-card{
    min-width:0;

    /*
       Mos lejo elementët jashtë kartës.
    */
    overflow:hidden;
}

.agenda-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:13px;
}

.agenda-title{
    font-size:16px;
    font-weight:800;
    color:#eaf7fa;
}

.search-box{
    width:220px;
}

.search-box input{
    height:36px;
}


/* =========================================================
   AGENDA LIST
========================================================= */

.agenda-list{
    display:flex;
    flex-direction:column;
    gap:7px;

    width:100%;
}


/* =========================================================
   SLOT
========================================================= */

.slot{
    width:100%;

    border:1px solid #183b47;
    border-radius:10px;

    overflow:hidden;

    background:#091d26;
}


/* =========================================================
   EMPTY SLOT
========================================================= */

.slot-empty{
    min-height:52px;

    display:flex;
    align-items:center;

    padding:0 12px;

    color:#68828d;
    font-size:12px;
}


/* =========================================================
   VISIT ITEM
========================================================= */

/*
   SHUMË E RËNDËSISHME:

   Vizita ka:
   1. rreshtin e informacionit
   2. butonat poshtë

   Nuk përdorim më një kolonë të ngushtë
   për 5 butonat.
*/

.visit-item{

    display:grid !important;

    grid-template-columns:
        65px
        minmax(160px,1fr)
        minmax(120px,180px) !important;

    gap:10px !important;

    width:100% !important;
    min-width:0 !important;

    min-height:85px;

    padding:10px 12px !important;

    background:#0b222d;

    border-left:4px solid #2995b5;

    align-items:center;

    position:relative;

    overflow:hidden;
}


/* =========================================================
   VISIT INFORMATION
========================================================= */

.visit-time{
    min-width:0;
    font-weight:800;
    font-size:13px;
    color:#dceff4;
}

.visit-patient{
    min-width:0;
    overflow:hidden;
}

.patient-name{
    font-size:13px;
    font-weight:800;
    color:#eaf7fa;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.patient-card{
    margin-top:3px;
    font-size:10px;
    color:#708c98;
}

.visit-type{
    min-width:0;

    font-size:11px;
    font-weight:700;
    color:#91b0bb;

    overflow:hidden;
}

.visit-payment{
    margin-top:3px;
    font-size:10px;
    color:#6d9eac;
}


/* =========================================================
   STATUS CONTROLS
========================================================= */

/*
   BUTONAT JANË 100% NË RRESHTIN E TYRE.
*/

.visit-status-controls{

    grid-column:1 / -1 !important;

    display:flex !important;

    flex-direction:row !important;

    align-items:center !important;

    justify-content:flex-start !important;

    flex-wrap:wrap !important;

    gap:6px !important;

    width:100% !important;

    min-width:0 !important;

    margin:3px 0 0 0 !important;

    padding:8px 0 2px 0 !important;

    border-top:1px solid #173743 !important;

    position:static !important;

    overflow:visible !important;

}


/* =========================================================
   ALL BUTTONS
========================================================= */

.visit-status-controls button{

    position:static !important;

    display:inline-flex !important;

    align-items:center !important;

    justify-content:center !important;

    flex:0 0 auto !important;

    width:auto !important;

    min-width:0 !important;

    height:32px !important;

    min-height:32px !important;

    margin:0 !important;

    padding:0 10px !important;

    border-radius:7px !important;

    white-space:nowrap !important;

    box-sizing:border-box !important;

    font-size:10px !important;

    line-height:1 !important;

    cursor:pointer !important;
}


/* Ka ardhur */

.visit-status-controls .arrived{

    width:82px !important;

    background:#103c2d !important;

    color:#7ee0b5 !important;

    border:1px solid #1d674d !important;
}


/* Ka mbaruar */

.visit-status-controls .finished{

    width:88px !important;

    background:#123657 !important;

    color:#8db9f0 !important;

    border:1px solid #255c8a !important;
}


/* Anullo */

.visit-status-controls .cancelled{

    width:62px !important;

    background:#401d21 !important;

    color:#ff9da4 !important;

    border:1px solid #753237 !important;
}


/* Ndrysho */

.visit-status-controls button:not(.arrived):not(.finished):not(.cancelled):not(.visit-delete-button){

    width:75px !important;

    background:#17343f !important;

    color:#a9c7d0 !important;

    border:1px solid #28505d !important;
}


/* Fshi */

.visit-status-controls .visit-delete-button{

    width:82px !important;

    background:#401d21 !important;

    color:#ff9da4 !important;

    border:1px solid #753237 !important;
}


/* Hover */

.visit-status-controls button:hover{
    filter:brightness(1.15);
}


/* =========================================================
   EDIT MODAL
========================================================= */

.modal-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.72);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:1000;

    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{

    width:min(480px,100%);

    background:#0b222d;

    border:1px solid #244754;

    border-radius:16px;

    padding:22px;

    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-title{

    font-size:18px;

    font-weight:800;

    color:#edf8fb;

    margin-bottom:15px;
}

.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:8px;

    margin-top:18px;
}

.modal-actions button{

    border:0;

    border-radius:8px;

    height:38px;

    padding:0 15px;

    cursor:pointer;

    font-weight:700;
}

.btn-secondary{

    background:#17343f;

    color:#bad0d7;
}

.btn-primary{

    background:#0b7897;

    color:white;
}

.btn-danger{

    background:#a52f36;

    color:white;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .workspace{

        grid-template-columns:
            minmax(0,1fr)
            minmax(300px,330px);

    }

    .visit-item{

        grid-template-columns:
            60px
            minmax(140px,1fr)
            minmax(105px,150px) !important;

    }
}


@media(max-width:950px){

    .sidebar{

        width:200px;
        min-width:200px;

    }

    .workspace{

        grid-template-columns:1fr;

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

    .visit-item{

        grid-template-columns:
            60px
            1fr !important;

    }

    .visit-type{

        grid-column:2;

    }

    .visit-status-controls{

        grid-column:1 / -1 !important;

    }
}


@media(max-width:700px){

    .app{

        display:block;

    }

    .sidebar{

        width:100%;
        min-width:0;

        padding:14px;

    }

    .nav{

        display:none;

    }

    .main{

        padding:12px;

    }

    .topbar{

        display:block;

    }

    .user-box{

        margin-top:10px;

        display:inline-block;

    }

    .stats{

        grid-template-columns:
            1fr 1fr;

    }

    .agenda-header{

        display:block;

    }

    .search-box{

        width:100%;

        margin-top:10px;

    }

    .visit-item{

        grid-template-columns:
            58px
            1fr !important;

    }

    .visit-type{

        grid-column:2;

    }

    .visit-status-controls{

        grid-column:1 / -1 !important;

        flex-wrap:wrap !important;

        gap:5px !important;

    }

    .visit-status-controls button{

        min-width:65px !important;

        width:auto !important;

    }

}


</style>
</head>

/* =========================================================
   DATE
========================================================= */

let selectedDate =
    new Date();


function dateToString(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


function formatDateLong(date){

    const days = [
        "E diel",
        "E hënë",
        "E martë",
        "E mërkurë",
        "E enjte",
        "E premte",
        "E shtunë"
    ];

    const months = [
        "Janar",
        "Shkurt",
        "Mars",
        "Prill",
        "Maj",
        "Qershor",
        "Korrik",
        "Gusht",
        "Shtator",
        "Tetor",
        "Nëntor",
        "Dhjetor"
    ];

    return (
        days[date.getDay()] +
        ", " +
        date.getDate() +
        " " +
        months[date.getMonth()] +
        " " +
        date.getFullYear()
    );
}


function updateDateDisplay(){

    selectedDateLabel.textContent =
        formatDateLong(
            selectedDate
        );

    selectedDateSmall.textContent =
        dateToString(
            selectedDate
        );
}

/* =========================================================
   SAVE
========================================================= */

async function saveVisit(){

    const name =
        patientName.value.trim();

    const type =
        visitType.value;

    const card =
        cardNumber.value.trim();

    const time =
        appointmentTime.value;


    let payment = null;


    if(!name){

        showMessage(
            "Vendosni emrin dhe mbiemrin.",
            "error"
        );

        return;
    }


    if(!time){

        showMessage(
            "Zgjidhni orarin.",
            "error"
        );

        return;
    }


    if(
        type === "Rikontroll"
    ){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        if(!selectedPayment){

            showMessage(
                "Zgjidhni Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }


        payment =
            selectedPayment.value;
    }


    saveButton.disabled =
        true;

    saveButton.textContent =
        "Po ruhet...";


    const result =
        await db
            .from("appointments")
            .insert({

                appointment_date:
                    dateToString(
                        selectedDate
                    ),

                appointment_time:
                    time,

                patient_name:
                    name,

                card_number:
                    card || null,

                visit_type:
                    type,

                payment_status:
                    payment,

                status:
                    "scheduled"

            });


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

    }else{

        showMessage(
            "Vizita u ruajt me sukses.",
            "success"
        );


        patientName.value =
            "";

        cardNumber.value =
            "";

        appointmentTime.value =
            "";

        visitType.value =
            "Vizitë";

        paymentBox.style.display =
            "none";


        document
            .querySelectorAll(
                'input[name="payment"]'
            )
            .forEach(
                function(radio){

                    radio.checked =
                        false;

                }
            );


        await loadVisits();
    }


    saveButton.disabled =
        false;

    saveButton.innerHTML =
        "＋ &nbsp; Ruaj Vizitën";
}


/* =========================================================
   LOAD
========================================================= */

async function loadVisits(){

    agendaList.innerHTML =
        "";


    const result =
        await db
            .from("appointments")
            .select(
                "id, appointment_date, appointment_time, patient_name, card_number, visit_type, payment_status, status"
            )
            .eq(
                "appointment_date",
                dateToString(
                    selectedDate
                )
            )
            .order(
                "appointment_time",
                {
                    ascending:true
                }
            );


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    const visits =
        result.data || [];


    updateStats(
        visits
    );


    const search =
        agendaSearch.value
            .trim()
            .toLowerCase();


    const filteredVisits =
        search
            ? visits.filter(
                function(visit){

                    return (

                        String(
                            visit.patient_name ||
                            ""
                        )
                        .toLowerCase()
                        .includes(search)

                        ||

                        String(
                            visit.card_number ||
                            ""
                        )
                        .toLowerCase()
                        .includes(search)

                    );

                }
            )
            : visits;


    const visitByTime =
        {};


    filteredVisits.forEach(
        function(visit){

            let time =
                visit.appointment_time;


            if(
                time &&
                time.length >= 5
            ){

                time =
                    time.substring(
                        0,
                        5
                    );
            }


            visitByTime[time] =
                visit;

        }
    );


    for(
        let minutes = 12 * 60;
        minutes <= 17 * 60;
        minutes += 15
    ){

        const hour =
            String(
                Math.floor(
                    minutes / 60
                )
            ).padStart(2,"0");


        const minute =
            String(
                minutes % 60
            ).padStart(2,"0");


        const time =
            hour +
            ":" +
            minute;


        const slot =
            document.createElement(
                "div"
            );

        slot.className =
            "slot";


        const visit =
            visitByTime[time];


        if(!visit){

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "slot-empty";


            empty.innerHTML =
                "<span>" +
                time +
                "</span>";


            slot.appendChild(
                empty
            );

        }else{

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "visit-item";


            /* STATUS BORDER */

            if(
                visit.status ===
                "arrived"
            ){

                item.style.borderLeftColor =
                    "#28a66b";

            }else if(
                visit.status ===
                "finished"
            ){

                item.style.borderLeftColor =
                    "#3e7ac8";

            }else if(
                visit.status ===
                "cancelled"
            ){

                item.style.borderLeftColor =
                    "#c23a3a";
            }


            /* TIME */

            const timeEl =
                document.createElement(
                    "div"
                );

            timeEl.className =
                "visit-time";

            timeEl.textContent =
                time;


            /* PATIENT */

            const patient =
                document.createElement(
                    "div"
                );

            patient.className =
                "visit-patient";


            const patientNameEl =
                document.createElement(
                    "div"
                );

            patientNameEl.className =
                "patient-name";

            patientNameEl.textContent =
                visit.patient_name ||
                "-";


            const cardEl =
                document.createElement(
                    "div"
                );

            cardEl.className =
                "patient-card";

            cardEl.textContent =
                visit.card_number
                    ? "Kartela: " +
                      visit.card_number
                    : "Pa nr. kartelë";


            patient.appendChild(
                patientNameEl
            );

            patient.appendChild(
                cardEl
            );


            /* TYPE */

            const typeEl =
                document.createElement(
                    "div"
                );

            typeEl.className =
                "visit-type";

            typeEl.textContent =
                visit.visit_type ||
                "-";


            if(
                visit.visit_type ===
                "Rikontroll"
                &&
                visit.payment_status
            ){

                const paymentEl =
                    document.createElement(
                        "div"
                    );

                paymentEl.className =
                    "visit-payment";

                paymentEl.textContent =
                    visit.payment_status;


                typeEl.appendChild(
                    paymentEl
                );
            }


            /* =================================================
               BUTTONS
            ================================================= */

            const controls =
                document.createElement(
                    "div"
                );

            controls.className =
                "visit-status-controls";


            const arrived =
                document.createElement(
                    "button"
                );

            arrived.type =
                "button";

            arrived.className =
                "arrived";

            arrived.textContent =
                "✓ Ka ardhur";


            const finished =
                document.createElement(
                    "button"
                );

            finished.type =
                "button";

            finished.className =
                "finished";

            finished.textContent =
                "✓ Ka mbaruar";


            const cancelled =
                document.createElement(
                    "button"
                );

            cancelled.type =
                "button";

            cancelled.className =
                "cancelled";

            cancelled.textContent =
                "Anullo";


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.type =
                "button";

            editButton.textContent =
                "✎ Ndrysho";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.type =
                "button";

            deleteButton.className =
                "visit-delete-button";

            deleteButton.textContent =
                "Fshi vizitën";


            arrived.addEventListener(
                "click",
                function(){

                    updateVisitStatus(
                        visit.id,
                        "arrived"
                    );

                }
            );


            finished.addEventListener(
                "click",
                function(){

                    updateVisitStatus(
                        visit.id,
                        "finished"
                    );

                }
            );


            cancelled.addEventListener(
                "click",
                function(){

                    updateVisitStatus(
                        visit.id,
                        "cancelled"
                    );

                }
            );


            editButton.addEventListener(
                "click",
                function(){

                    openEditModal(
                        visit
                    );

                }
            );


            /*
               KORRIGJIM:
               Fshirja hap konfirmimin.
            */

            deleteButton.addEventListener(
                "click",
                function(){

                    openDeleteConfirm(
                        visit.id
                    );

                }
            );


            controls.appendChild(
                arrived
            );

            controls.appendChild(
                finished
            );

            controls.appendChild(
                cancelled
            );

            controls.appendChild(
                editButton
            );

            controls.appendChild(
                deleteButton
            );


            /*
               RENDITJA:
               Informacioni lart,
               butonat poshte.
            */

            item.appendChild(
                timeEl
            );

            item.appendChild(
                patient
            );

            item.appendChild(
                typeEl
            );

            item.appendChild(
                controls
            );


            slot.appendChild(
                item
            );
        }


        agendaList.appendChild(
            slot
        );
    }
}


/* =========================================================
   STATS
========================================================= */

function updateStats(visits){

    statTotal.textContent =
        visits.length;


    statVisits.textContent =
        visits.filter(
            function(v){

                return (
                    v.visit_type ===
                    "Vizitë"
                );

            }
        ).length;


    statRechecks.textContent =
        visits.filter(
            function(v){

                return (
                    v.visit_type ===
                    "Rikontroll"
                );

            }
        ).length;


    statCancelled.textContent =
        visits.filter(
            function(v){

                return (
                    v.status ===
                    "cancelled"
                );

            }
        ).length;
}


/* =========================================================
   UPDATE STATUS
========================================================= */

async function updateVisitStatus(
    id,
    status
){

    const result =
        await db
            .from("appointments")
            .update({
                status:status
            })
            .eq(
                "id",
                id
            );


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    await loadVisits();
}


/* =========================================================
   DELETE
========================================================= */

let pendingDeleteId =
    null;


function openDeleteConfirm(id){

    pendingDeleteId =
        id;


    const modal =
        document.getElementById(
            "deleteConfirmModal"
        );


    if(modal){

        modal.classList.add(
            "show"
        );
    }
}


function closeDeleteConfirm(){

    pendingDeleteId =
        null;


    const modal =
        document.getElementById(
            "deleteConfirmModal"
        );


    if(modal){

        modal.classList.remove(
            "show"
        );
    }
}


async function confirmDeleteVisit(){

    if(!pendingDeleteId){
        return;
    }


    const id =
        pendingDeleteId;


    closeDeleteConfirm();


    const result =
        await db
            .from("appointments")
            .delete()
            .eq(
                "id",
                id
            );


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Vizita u fshi.",
        "success"
    );


    await loadVisits();
}

    ){

        const hour =

                Math.floor(

                )
            ).padStart(2,"0");


        const minute =
            String(
                minutes % 60
            ).padStart(2,"0");


        const value =

            ":" +

        const option =

        editAppointmentTime.appendChild(

function updateEditPaymentBox(){

        editVisitType.value ===
        "Rikontroll"
    ){

        editPaymentBox.style.display =
            "block";

    }else{

        editPaymentBox.style.display =
            "none";


        document

function openEditModal(visit){

        visit.id;


    editPatientName.value =
        visit.patient_name ||
        "";


    editVisitType.value =
        visit.visit_type ||
        "Vizitë";


    editCardNumber.value =
        visit.card_number ||

    editAppointmentTime.value =
        visit.appointment_time;


    updateEditPaymentBox();


    if(
        visit.payment_status
    ){

        const radio =
            document.querySelector(
                'input[name="editPayment"][value="' +
                visit.payment_status +
                '"]'
            );


        if(radio){

            radio.checked =
                true;

        }

    );

            closeEditModal();


            showMessage(
                "Ndryshimet u ruajtën.",
