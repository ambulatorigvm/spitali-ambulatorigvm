<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;

.container{

    display:block !important;

    display:block !important;

</head>

<body>

<div class="container">

<h1>AMBULATORI GVM</h1>

<div class="card">

<div id="message"></div>

<label>Emër Mbiemër</label>

<input
    id="patientName"
    type="text"
    placeholder="Emër Mbiemër"
>


<label>Nr. Kartelës</label>

<input
    id="cardNumber"
    type="text"
    placeholder="Nr. Kartelës"
>


<label>Lloji i vizitës</label>

<select id="visitType">

    <option value="Vizitë">
        Vizitë
    </option>

    <option value="Rikontroll">
        Rikontroll
    </option>

</select>


<div id="paymentBox">

    <label>Pagesa</label>

    <label class="payment-option">

        <input
            type="radio"
            name="payment"
            value="Me pagesë"
        >

        Me pagesë

    </label>


    <label class="payment-option">

        <input
            type="radio"
            name="payment"
            value="Pa pagesë"
        >

        Pa pagesë

    </label>

</div>


<label>Ora</label>

<select id="appointmentTime">

    <option value="">
        Zgjidh orën
    </option>

</select>


<button onclick="saveVisit()">
    Ruaj Vizitën
</button>

</div>


<div class="card">

<div class="day-header">

<div>

<h2>Vizitat e ditës</h2>

<div id="currentDate"></div>

</div>

<button
    class="refresh"
    onclick="loadVisits()"
>
    Rifresko
</button>

</div>


<div id="visits">

    <div class="empty">
        Po ngarkohet...
    </div>

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTET
========================= */

const visitType =
document.getElementById("visitType");

const paymentBox =
document.getElementById("paymentBox");

const appointmentTime =
document.getElementById("appointmentTime");

const visits =
document.getElementById("visits");

const message =
document.getElementById("message");


/* =========================
   DATA
========================= */

function today(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");
}


function showDate(){

    const d = new Date();

    document.getElementById(
        "currentDate"
    ).textContent =
        String(d.getDate()).padStart(2,"0")
        + "/"
        + String(d.getMonth()+1).padStart(2,"0")
        + "/"
        + d.getFullYear();
}


/* =========================
   ORARET
========================= */

for(
    let h = 12;
    h <= 17;
    h++
){

    for(
        let m = 0;
        m < 60;
        m += 15
    ){

        if(
            h === 17 &&
            m > 0
        ){
            continue;
        }

        const time =
            String(h).padStart(2,"0")
            + ":"
            + String(m).padStart(2,"0");


        const option =
        document.createElement("option");

        option.value = time;

        option.textContent = time;

        appointmentTime.appendChild(
            option
        );
    }
}


/* =========================
   RIKONTROLL
========================= */

visitType.addEventListener(
    "change",
    function(){

        if(
            this.value === "Rikontroll"
        ){

            paymentBox.style.display =
                "block";

        }else{

            paymentBox.style.display =
                "none";

            document
            .querySelectorAll(
                'input[name="payment"]'
            )
            .forEach(
                r => r.checked = false
            );
        }
    }
);


/* =========================
   MESAZH
========================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        type;

    message.style.display =
        "block";

    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        5000
    );
}


/* =========================
   RUAJ
========================= */

async function saveVisit(){

    const patientName =
        document
        .getElementById("patientName")
        .value
        .trim();


    const cardNumber =
        document
        .getElementById("cardNumber")
        .value
        .trim();


    const type =
        visitType.value;


    const time =
        appointmentTime.value;


    if(!patientName){

        showMessage(
            "Vendos emrin e pacientit.",
            "error"
        );

        return;
    }


    if(!time){

        showMessage(
            "Zgjidh orën.",
            "error"
        );

        return;
    }


    let payment = null;


    if(type === "Rikontroll"){

        const selected =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        if(!selected){

            showMessage(
                "Zgjidh Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }


        payment =
            selected.value;
    }


    const date =
        today();


    /* Kontrollo orën */

    const {
        data: occupied,
        error: checkError
    } =
    await db
    .from("appointments")
    .select("id")
    .eq(
        "appointment_date",
        date
    )
    .eq(
        "appointment_time",
        time
    );


    if(checkError){

        showMessage(
            "Gabim: "
            + checkError.message,
            "error"
        );

        console.error(
            checkError
        );

        return;
    }


    if(
        occupied &&
        occupied.length > 0
    ){

        showMessage(
            "Kjo orë është e zënë.",
            "error"
        );

        return;
    }


    /* INSERT */

    const {
        data,
        error
    } =
    await db
    .from("appointments")
    .insert({

        appointment_date:
            date,

        appointment_time:
            time,

        patient_name:
            patientName,

        card_number:
            cardNumber || null,

        visit_type:
            type,

        payment_status:
            payment

    })
    .select();


    if(error){

        showMessage(
            "Gabim gjatë ruajtjes: "
            + error.message,
            "error"
        );

        console.error(
            error
        );

        return;
    }


    console.log(
        "Vizita u ruajt:",
        data
    );


    showMessage(
        "Vizita u ruajt me sukses.",
        "success"
    );


    /* Pastro */

    document
    .getElementById("patientName")
    .value = "";

    document
    .getElementById("cardNumber")
    .value = "";

    appointmentTime.value = "";

    visitType.value =
        "Vizitë";

    paymentBox.style.display =
        "none";


    document
    .querySelectorAll(
        'input[name="payment"]'
    )
    .forEach(
        r => r.checked = false
    );


    loadVisits();
}


/* =========================
   NGARKO
========================= */

async function loadVisits(){

    visits.innerHTML =
        '<div class="empty">Po ngarkohet...</div>';


    const date =
        today();


    const {
        data,
        error
    } =
    await db
    .from("appointments")
    .select("*")
    .eq(
        "appointment_date",
        date
    )
    .order(
        "appointment_time",
        {
            ascending:true
        }
    );


    if(error){

        visits.innerHTML =
            '<div class="empty">'
            + "Gabim Supabase: "
            + escapeHTML(
                error.message
            )
            + "</div>";

        console.error(
            error
        );

        return;
    }


    if(
        !data ||
        data.length === 0
    ){

        visits.innerHTML =
            '<div class="empty">'
            + "Nuk ka vizita për sot."
            + "</div>";

        return;
    }


    visits.innerHTML = "";


    data.forEach(
        function(v){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "visit-item";


            const time =
                String(
                    v.appointment_time
                ).substring(0,5);


            let payment = "";


            if(
                v.payment_status
            ){

                payment =
                    " — "
                    +
                    v.payment_status;
            }


            item.innerHTML = `

                <div class="visit-time">
                    ${escapeHTML(time)}
                </div>

                <div class="visit-name">
                    ${escapeHTML(
                        v.patient_name
                    )}
                </div>

                <div class="visit-info">

                    Kartela:
                    ${escapeHTML(
                        v.card_number || "-"
                    )}

                    <br>

                    ${escapeHTML(
                        v.visit_type
                    )}

                    ${escapeHTML(
                        payment
                    )}

                </div>

                <button
                    class="delete"
                    onclick="deleteVisit(${v.id})"
                >
                    Fshi vizitën
                </button>

            `;


            visits.appendChild(
                item
            );
        }
    );
}


/* =========================
   FSHI
========================= */

async function deleteVisit(id){

    if(
        !confirm(
            "Je i sigurt që dëshiron ta fshish?"
        )
    ){
        return;
    }


    const {
        error
    } =
    await db
    .from("appointments")
    .delete()
    .eq(
        "id",
        id
    );


    if(error){

        showMessage(
            "Gabim gjatë fshirjes: "
            + error.message,
            "error"
        );

        return;
    }


    loadVisits();
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

    return String(value)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =========================
   START
========================= */

showDate();

loadVisits();

</script>

</body>
</html>
```
