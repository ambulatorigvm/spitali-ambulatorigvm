<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambulatori GVM</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#155e75;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input,select{
    width:100%;
    height:45px;
    margin-bottom:10px;
    padding:10px;
    box-sizing:border-box;
}

button{
    height:45px;
    border:none;
    background:#0891b2;
    color:white;
    padding:0 20px;
    border-radius:6px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<h1>AMBULATORI GVM</h1>

<div class="card">

<input
type="text"
placeholder="Emër Mbiemër">

<input
type="text"
placeholder="Nr. Kartelës">

<select>

<option>Vizitë</option>
<option>Rikontroll</option>

</select>

<select id="ora">

<option>Zgjidh orën</option>

</select>

<button>
Ruaj Vizitën
</button>

</div>

</div>

<script>

const ora =
document.getElementById("ora");

for(let h=12; h<=17; h++){

    for(let m=0; m<60; m+=15){

        if(h===17 && m>0){
            continue;
        }

        const time =
        String(h).padStart(2,"0")
        + ":"
        +
        String(m).padStart(2,"0");

        const option =
        document.createElement("option");

        option.value=time;
        option.textContent=time;

        ora.appendChild(option);
    }
}

</script>

</body>
</html>
