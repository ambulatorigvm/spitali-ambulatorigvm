<!DOCTYPE html>
<html lang="sq">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMBULATORI GVM</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#1f2937;
}

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#155e75;
    margin-bottom:25px;
}

h2{
    color:#155e75;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    height:45px;
    margin-bottom:15px;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:16px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#0891b2;
}

button{
    width:100%;
    height:45px;
    border:none;
    background:#0891b2;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#0e7490;
}

button:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

/* PAYMENT */

#paymentBox{
    display:none;
    margin-bottom:15px;
    padding:15px;
    background:#f8fafc;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

.payment-option{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-weight:normal;
}

.payment-option input{
    width:auto;
    height:auto;
    margin:0;
}

/* MESSAGE */

#message{
    display:none;
    padding:12px;
    margin-bottom:20px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.message-success{
    display:block !important;
    background:#dcfce7;
    color:#166534;
    border:1px solid #86efac;
}

.message-error{
    display:block !important;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fca5a5;
}

/* DATE */

.date-title{
    text-align:center;
    font-size:18px;
    color:#475569;
    margin-bottom:20px;
}

/* VISITS */

#visits{
    margin-top:15px;
}

.visit-item{
    background:white;
    border-radius:10px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-left:6px solid #0891b2;
}

.visit-time{
    font-size:24px;
    font-weight:bold;
    color:#155e75;
    margin-bottom:10px;
}

.visit-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:7px;
}

.visit-line{
    margin:5px 0;
    color:#475569;
}

.visit-type{
    display:inline-block;
    margin-top:8px;
    padding:6px 10px;
    border-radius:6px;
    background:#e0f2fe;
    color:#075985;
    font-weight:bold;
}

.payment-paid{
    display:inline-block;
    margin-top:8px;
    margin-left:5px;
    padding:6px 10px;
    border-radius:6px;
    background:#fef3c7;
    color:#92400e;
    font-weight:bold;
}

.payment-free{
    display:inline-block;
    margin-top:8px;
    margin-left:5px;
    padding:6px 10px;
    border-radius:6px;
    background:#dcfce7;
    color:#166534;
    font-weight:bold;
}

.delete-button{
    margin-top:15px;
    background:#dc2626;
    height:40px;
    font-size:14px;
}

.delete-button:hover{
    background:#b91c1c;
}

.empty{
    text-align:center;
    padding:30px;
    background:white;
    border-radius:10px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:25px;
    color:#64748b;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    h1{
        font-size:25px;
    }

    .card{
        padding:15px;
    }

    .visit-time{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>AMBULATORI GVM</h1>

    <div id="message"></div>

    <!-- FORMULARI -->

    <div class="card">

        <label for="patientName">
            Emër Mbiemër
        </label>

        <input
            type="text"
            id="patientName"
            placeholder="Emër Mbiemër"
            autocomplete="off"
        >

        <label for="cardNumber">
            Nr. Kartelës
        </label>

        <input
            type="text"
            id="cardNumber"
            placeholder="Nr. Kartelës"
            autocomplete="off"
        >

        <label for="visitType">
            Lloji i vizitës
        </label>

        <select id="visitType">

            <option value="Vizitë">
                Vizitë
            </option>

            <option value="Rikontroll">
                Rikontroll
            </option>

        </select>

        <!-- PAGESA -->

        <div id="paymentBox">

            <label>
                Pagesa
            </label>

            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Me pagesë"
                >

                <span>
                    Me pagesë
                </span>

            </label>

            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Pa pagesë"
                >

                <span>
                    Pa pagesë
                </span>

            </label>

        </div>

        <!-- ORA -->

        <label for="appointmentTime">
            Ora
        </label>

        <select id="appointmentTime">

            <option value="">
                Zgjidh orën
            </option>

        </select>

        <button
            id="saveButton"
            type="button"
        >
            Ruaj Vizitën
        </button>

    </div>

    <!-- VIZITAT -->

    <h2>
        Vizitat e ditës
    </h2>

    <div
        id="todayDate"
        class="date-title"
    ></div>

    <div id="visits">

        <div class="loading">
            Po ngarkohen vizitat...
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTET
========================================================= */

const patientName =
    document.getElementById("patientName");

const cardNumber =
    document.getElementById("cardNumber");

const visitType =
    document.getElementById("visitType");

const paymentBox =
    document.getElementById("paymentBox");

const appointmentTime =
    document.getElementById("appointmentTime");

const saveButton =
    document.getElementById("saveButton");

const visits =
    document.getElementById("visits");

const message =
    document.getElementById("message");

const todayDate =
    document.getElementById("todayDate");


/* =========================================================
   DATA E SOTME
========================================================= */

function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =========================================================
   SHFAQ DATEN
========================================================= */

function showTodayDate(){

    const now = new Date();

    const formatted =
        now.toLocaleDateString(
            "sq-AL",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

    todayDate.textContent =
        formatted;

}


/* =========================================================
   KRIJO ORARET
========================================================= */

function createTimeOptions(){

    appointmentTime.innerHTML =
        '<option value="">Zgjidh orën</option>';

    for(
        let hour = 12;
        hour <= 17;
        hour++
    ){

        for(
            let minute = 0;
            minute < 60;
            minute += 15
        ){

            if(
                hour === 17 &&
                minute > 0
            ){
                continue;
            }

            const time =
                String(hour).padStart(2,"0")
                +
                ":"
                +
                String(minute).padStart(2,"0");

            const option =
                document.createElement("option");

            option.value =
                time;

            option.textContent =
                time;

            appointmentTime.appendChild(
                option
            );
        }
    }

}


/* =========================================================
   SHOW / HIDE PAGESEN
========================================================= */

visitType.addEventListener(
    "change",
    function(){

        if(
            visitType.value ===
            "Rikontroll"
        ){

            paymentBox.style.display =
                "block";

        }
        else{

            paymentBox.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="payment"]'
                )
                .forEach(
                    function(radio){
                        radio.checked =
                            false;
                    }
                );
        }

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "";

    if(type === "success"){

        message.classList.add(
            "message-success"
        );

    }
    else{

        message.classList.add(
            "message-error"
        );

    }

    setTimeout(
        function(){

            message.style.display =
                "none";

            message.className =
                "";

        },
        5000
    );

}


/* =========================================================
   RUAJ VIZITEN
========================================================= */

async function saveVisit(){

    const name =
        patientName.value.trim();

    const card =
        cardNumber.value.trim();

    const type =
        visitType.value;

    const time =
        appointmentTime.value;

    let payment =
        null;


    /* VALIDIM */

    if(!name){

        showMessage(
            "Vendos Emër Mbiemër.",
            "error"
        );

        patientName.focus();

        return;
    }


    if(!time){

        showMessage(
            "Zgjidh orën e vizitës.",
            "error"
        );

        appointmentTime.focus();

        return;
    }


    /* PAGESA VETEM PER RIKONTROLL */

    if(type === "Rikontroll"){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );

        if(!selectedPayment){

            showMessage(
                "Zgjidh Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }

        payment =
            selectedPayment.value;

    }


    const date =
        getToday();


    /* DISABLE BUTTON */

    saveButton.disabled =
        true;

    saveButton.textContent =
        "Po ruhet...";


    console.log(
        "Po ruhet vizita:",
        {
            appointment_date:date,
            appointment_time:time,
            patient_name:name,
            card_number:card || null,
            visit_type:type,
            payment_status:payment
        }
    );


    /* INSERT SUPABASE */

    const result =
        await db
            .from("appointments")
            .insert({
                appointment_date: date,
                appointment_time: time,
                patient_name: name,
                card_number: card || null,
                visit_type: type,
                payment_status: payment
            })
            .select();


    console.log(
        "Supabase result:",
        result
    );


    /* GABIM */

    if(result.error){

        console.error(
            "SUPABASE INSERT ERROR:",
            result.error
        );

        showMessage(
            "Gabim Supabase: " +
            result.error.message,
            "error"
        );

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Ruaj Vizitën";

        return;
    }


    /* SUKSES */

    showMessage(
        "Vizita u ruajt me sukses.",
        "success"
    );


    /* PASTRO FORMULAREN */

    patientName.value =
        "";

    cardNumber.value =
        "";

    appointmentTime.value =
        "";

    visitType.value =
        "Vizitë";

    paymentBox.style.display =
        "none";


    document
        .querySelectorAll(
            'input[name="payment"]'
        )
        .forEach(
            function(radio){

                radio.checked =
                    false;

            }
        );


    saveButton.disabled =
        false;

    saveButton.textContent =
        "Ruaj Vizitën";


    /* RINGARKO LISTEN */

    await loadVisits();

}


/* =========================================================
   NGARKO VIZITAT E SOTME
========================================================= */

async function loadVisits(){

    visits.innerHTML =
        '<div class="loading">Po ngarkohen vizitat...</div>';


    const date =
        getToday();


    const result =
        await db
            .from("appointments")
            .select(
                "id, appointment_date, appointment_time, patient_name, card_number, visit_type, payment_status"
            )
            .eq(
                "appointment_date",
                date
            )
            .order(
                "appointment_time",
                {
                    ascending:true
                }
            );


    console.log(
        "LOAD VISITS:",
        result
    );


    if(result.error){

        console.error(
            "SUPABASE SELECT ERROR:",
            result.error
        );

        visits.innerHTML = "";

        const errorBox =
            document.createElement("div");

        errorBox.className =
            "empty";

        errorBox.innerHTML =
            "<strong>Gabim gjatë ngarkimit</strong><br><br>" +
            result.error.message;

        visits.appendChild(
            errorBox
        );

        return;
    }


    const data =
        result.data || [];


    if(data.length === 0){

        visits.innerHTML =
            '<div class="empty">' +
            'Nuk ka vizita të regjistruara për sot.' +
            '</div>';

        return;
    }


    visits.innerHTML =
        "";


    data.forEach(
        function(visit){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "visit-item";


            /* ORA */

            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "visit-time";

            time.textContent =
                visit.appointment_time
                    ? String(
                        visit.appointment_time
                    ).substring(0,5)
                    : "--:--";


            /* EMRI */

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "visit-name";

            name.textContent =
                visit.patient_name ||
                "";


            /* KARTELA */

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "visit-line";

            card.innerHTML =
                "<strong>Nr. Kartelës:</strong> " +
                (
                    visit.card_number ||
                    "—"
                );


            /* LLOJI */

            const type =
                document.createElement(
                    "span"
                );

            type.className =
                "visit-type";

            type.textContent =
                visit.visit_type ||
                "Vizitë";


            /* KONTAINER PER TIP + PAGESEN */

            const statusLine =
                document.createElement(
                    "div"
                );

            statusLine.appendChild(
                type
            );


            /* PAGESA */

            if(
                visit.visit_type ===
                "Rikontroll"
            ){

                const payment =
                    document.createElement(
                        "span"
                    );


                if(
                    visit.payment_status ===
                    "Me pagesë"
                ){

                    payment.className =
                        "payment-paid";

                    payment.textContent =
                        "Me pagesë";

                }
                else if(
                    visit.payment_status ===
                    "Pa pagesë"
                ){

                    payment.className =
                        "payment-free";

                    payment.textContent =
                        "Pa pagesë";

                }
                else{

                    payment.className =
                        "payment-paid";

                    payment.textContent =
                        "Pagesa nuk është zgjedhur";

                }


                statusLine.appendChild(
                    payment
                );

            }


            /* BUTONI FSHI */

            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-button";

            deleteButton.type =
                "button";

            deleteButton.textContent =
                "Fshi vizitën";


            deleteButton.addEventListener(
                "click",
                function(){

                    deleteVisit(
                        visit.id
                    );

                }
            );


            /* SHTO ELEMENTET */

            item.appendChild(
                time
            );

            item.appendChild(
                name
            );

            item.appendChild(
                card
            );

            item.appendChild(
                statusLine
            );

            item.appendChild(
                deleteButton
            );


            visits.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   FSHI VIZITEN
========================================================= */

async function deleteVisit(
    id
){

    const confirmed =
        confirm(
            "A dëshiron ta fshish këtë vizitë?"
        );


    if(!confirmed){
        return;
    }


    const result =
        await db
            .from("appointments")
            .delete()
            .eq(
                "id",
                id
            );


    console.log(
        "DELETE RESULT:",
        result
    );


    if(result.error){

        console.error(
            "SUPABASE DELETE ERROR:",
            result.error
        );

        showMessage(
            "Gabim gjatë fshirjes: " +
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Vizita u fshi.",
        "success"
    );


    await loadVisits();

}


/* =========================================================
   START
========================================================= */

showTodayDate();

createTimeOptions();

loadVisits();

</script>

</body>
</html>
