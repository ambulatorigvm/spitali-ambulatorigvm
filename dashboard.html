<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMBULATORI GVM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef4f8;
    color:#173042;
}

button,
input,
select{
    font-family:inherit;
}

/* =========================================================
   LAYOUT
========================================================= */

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:245px;
    min-width:245px;
    background:#082838;
    color:white;
    padding:24px 18px;
    display:flex;
    flex-direction:column;
}

.brand{
    padding:8px 10px 28px;
    border-bottom:1px solid rgba(255,255,255,.12);
}

.brand-main{
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
}

.brand-sub{
    margin-top:5px;
    font-size:12px;
    color:#8fb5c6;
    letter-spacing:1.2px;
}

.nav{
    margin-top:25px;
}

.nav-item{
    padding:13px 14px;
    border-radius:10px;
    color:#b9ced8;
    font-size:14px;
    margin-bottom:7px;
}

.nav-item.active{
    background:#0f4258;
    color:white;
}

.main{
    flex:1;
    min-width:0;
    padding:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.page-title{
    font-size:24px;
    font-weight:800;
    color:#102f40;
}

.page-subtitle{
    margin-top:4px;
    color:#728896;
    font-size:13px;
}

.user-box{
    background:white;
    border:1px solid #dce7ed;
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
    color:#506b78;
}

/* =========================================================
   DATE NAVIGATION
========================================================= */

.date-navigation{
    background:white;
    border:1px solid #dce7ed;
    border-radius:14px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
}

.date-navigation button{
    border:0;
    background:#edf5f8;
    color:#12384a;
    width:38px;
    height:38px;
    border-radius:9px;
    cursor:pointer;
    font-size:18px;
}

.date-navigation button:hover{
    background:#dcecf2;
}

.date-center{
    text-align:center;
    flex:1;
}

.date-main{
    font-size:17px;
    font-weight:800;
    color:#163a4c;
}

.date-small{
    margin-top:3px;
    font-size:12px;
    color:#78909c;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px;
}

.stat-card{
    background:white;
    border:1px solid #dce7ed;
    border-radius:14px;
    padding:15px;
}

.stat-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:#8095a0;
}

.stat-value{
    margin-top:7px;
    font-size:25px;
    font-weight:800;
    color:#173b4e;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    display:none;
    margin-bottom:15px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
}

.message.show{
    display:block;
}

.message.success{
    background:#e8f7ef;
    border:1px solid #b8e3ca;
    color:#14683c;
}

.message.error{
    background:#fff0f0;
    border:1px solid #efc0c0;
    color:#a52d2d;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    display:grid;
    grid-template-columns:minmax(310px,.82fr) minmax(500px,1.35fr);
    gap:15px;
    align-items:start;
}

.card{
    background:white;
    border:1px solid #dce7ed;
    border-radius:15px;
    padding:18px;
    box-shadow:0 3px 15px rgba(20,60,80,.04);
}

.card-title{
    font-size:16px;
    font-weight:800;
    color:#173a4c;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:8px;
}

.title-icon{
    width:27px;
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7f3f8;
    color:#0d6d8d;
    border-radius:8px;
    font-size:17px;
}

/* =========================================================
   FORM
========================================================= */

label{
    display:block;
    margin:12px 0 6px;
    font-size:12px;
    font-weight:700;
    color:#506b78;
}

input[type="text"],
select{
    width:100%;
    height:42px;
    border:1px solid #ccdce4;
    background:#fbfdfe;
    border-radius:9px;
    padding:0 12px;
    color:#173042;
    outline:none;
    font-size:13px;
}

input[type="text"]:focus,
select:focus{
    border-color:#5da4bf;
    box-shadow:0 0 0 3px rgba(93,164,191,.12);
}

#paymentBox{
    display:none;
    margin-top:12px;
    padding:12px;
    border:1px solid #dce7ed;
    background:#f7fbfd;
    border-radius:10px;
}

.payment-option{
    display:flex;
    align-items:center;
    gap:8px;
    margin:8px 0;
    padding:7px 8px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
    color:#315361;
}

.payment-option:hover{
    background:#eaf4f8;
}

.payment-option input{
    width:16px;
    height:16px;
    margin:0;
}

#saveButton{
    width:100%;
    height:44px;
    margin-top:20px;
    border:0;
    border-radius:10px;
    background:#0b718f;
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

#saveButton:hover{
    background:#095f79;
}

#saveButton:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================================================
   AGENDA
========================================================= */

.agenda-card{
    min-width:0;
}

.agenda-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:13px;
}

.agenda-title{
    font-size:16px;
    font-weight:800;
    color:#173a4c;
}

.search-box{
    width:220px;
}

.search-box input{
    height:36px;
}

.agenda-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.slot{
    border:1px solid #e0e9ee;
    border-radius:10px;
    overflow:hidden;
    background:#fff;
}

.slot-empty{
    min-height:52px;
    display:flex;
    align-items:center;
    padding:0 12px;
    color:#91a2ab;
    font-size:12px;
}

.visit-item{
    display:grid;
    grid-template-columns:
        72px
        minmax(150px,1.15fr)
        minmax(105px,.8fr)
        minmax(240px,auto);
    align-items:center;
    gap:10px;
    width:100%;
    min-height:62px;
    padding:9px 11px;
    background:white;
    border-left:4px solid #2995b5;
}

.visit-time{
    font-weight:800;
    font-size:13px;
    color:#183d4f;
}

.visit-patient{
    min-width:0;
}

.patient-name{
    font-size:13px;
    font-weight:800;
    color:#173a4c;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.patient-card{
    margin-top:3px;
    font-size:10px;
    color:#8a9ca5;
}

.visit-type{
    font-size:11px;
    font-weight:700;
    color:#496b79;
}

.visit-payment{
    margin-top:3px;
    font-size:10px;
    color:#8a9ca5;
}

.visit-status-controls{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    flex-wrap:wrap;
    gap:5px;
    width:100%;
}

.visit-status-button,
.visit-delete-button{
    border:0;
    cursor:pointer;
    height:31px;
    min-height:31px;
    padding:0 8px;
    border-radius:7px;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.visit-status-button.arrived{
    background:#e5f7ed;
    color:#167144;
}

.visit-status-button.finished{
    background:#e7f0ff;
    color:#275ca8;
}

.visit-status-button.cancelled{
    background:#fff0f0;
    color:#a32d2d;
}

.visit-status-button:not(.arrived):not(.finished):not(.cancelled){
    background:#edf3f6;
    color:#315361;
}

.visit-delete-button{
    background:#fff0f0;
    color:#a52d2d;
}

.visit-status-button:hover,
.visit-delete-button:hover{
    filter:brightness(.96);
}

/* =========================================================
   FIX: BUTONAT E AGJENDËS MOS TË MBIVENDOSEN
========================================================= */

.workspace > .card:not(.agenda-card){
    position:relative;
    z-index:20;
}

.workspace > .agenda-card{
    position:relative;
    z-index:10;
    min-width:0;
    overflow:hidden;
}

#paymentBox,
#paymentBox *{
    position:relative;
    z-index:30;
    pointer-events:auto;
}

.visit-item{
    grid-template-columns:
        64px
        minmax(135px,1.15fr)
        minmax(95px,.75fr)
        minmax(315px,315px) !important;

    min-width:0 !important;
}

.visit-status-controls{
    display:flex !important;
    align-items:center !important;
    justify-content:flex-start !important;
    flex-wrap:wrap !important;
    gap:5px !important;
    width:100% !important;
    min-width:0 !important;
    margin:0 !important;
    padding:0 !important;
}

.visit-status-button,
.visit-delete-button{
    width:auto !important;
    min-width:0 !important;
    height:31px !important;
    min-height:31px !important;
    flex:0 0 auto !important;
    margin:0 !important;
    padding:0 8px !important;
    white-space:nowrap !important;
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;
    border-radius:7px !important;
    font-size:10px !important;
    line-height:1 !important;
}

.visit-status-button.arrived{
    min-width:68px !important;
}

.visit-status-button.finished{
    min-width:74px !important;
}

.visit-status-button.cancelled{
    min-width:52px !important;
}

.visit-status-button:not(.arrived):not(.finished):not(.cancelled){
    min-width:65px !important;
}

.visit-delete-button{
    min-width:72px !important;
}

/* =========================================================
   EDIT MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(3,22,31,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:min(480px,100%);
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-title{
    font-size:18px;
    font-weight:800;
    color:#163b4d;
    margin-bottom:15px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.modal-actions button{
    border:0;
    border-radius:8px;
    height:38px;
    padding:0 15px;
    cursor:pointer;
    font-weight:700;
}

.btn-secondary{
    background:#edf3f6;
    color:#365563;
}

.btn-primary{
    background:#0b718f;
    color:white;
}

.btn-danger{
    background:#b83333;
    color:white;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

    .workspace{
        grid-template-columns:minmax(300px,.75fr) minmax(460px,1.25fr);
    }

    .visit-item{
        grid-template-columns:
            60px
            minmax(130px,1fr)
            minmax(100px,.8fr)
            300px !important;
    }

    .visit-status-controls{
        gap:4px !important;
    }

    .visit-status-button,
    .visit-delete-button{
        font-size:9px !important;
        padding:0 6px !important;
    }

    .visit-status-button.arrived{
        min-width:68px !important;
    }

    .visit-status-button.finished{
        min-width:73px !important;
    }

    .visit-status-button.cancelled{
        min-width:53px !important;
    }

    .visit-status-controls button:not(.arrived):not(.finished):not(.cancelled):not(.visit-delete-button){
        min-width:65px !important;
    }

    .visit-delete-button{
        min-width:70px !important;
    }
}

@media(max-width:1050px){

    .workspace > .agenda-card{
        overflow:visible;
    }

    .visit-item{
        grid-template-columns:
            60px
            minmax(120px,1fr)
            minmax(95px,.8fr)
            minmax(135px,1fr) !important;
    }

    .visit-status-controls{
        grid-column:1/-1 !important;
        justify-content:flex-start !important;
        flex-wrap:wrap !important;
        overflow:visible !important;
    }
}

@media(max-width:950px){

    .sidebar{
        width:200px;
        min-width:200px;
    }

    .workspace{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .visit-item{
        grid-template-columns:
            60px
            1fr
            1fr !important;
    }

    .visit-status-controls{
        grid-column:1/-1 !important;
        width:100% !important;
        display:flex !important;
        flex-wrap:wrap !important;
        justify-content:flex-start !important;
        padding-top:5px !important;
    }
}

@media(max-width:760px){

    .app{
        display:block;
    }

    .sidebar{
        width:100%;
        min-width:0;
        padding:14px;
    }

    .nav{
        display:none;
    }

    .main{
        padding:12px;
    }

    .topbar{
        display:block;
    }

    .user-box{
        margin-top:10px;
        display:inline-block;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .agenda-header{
        display:block;
    }

    .search-box{
        width:100%;
        margin-top:10px;
    }

    .visit-item{
        grid-template-columns:58px 1fr !important;
    }

    .visit-status-controls{
        grid-column:1/-1 !important;
        flex-wrap:wrap !important;
        overflow:visible !important;
    }

    .visit-status-button,
    .visit-delete-button,
    .visit-status-controls button{
        width:auto !important;
        min-width:65px !important;
        height:32px !important;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-main">SPITALI GVM</div>
            <div class="brand-sub">AMBULATORI GVM</div>
        </div>

        <div class="nav">
            <div class="nav-item active">
                📅 &nbsp; Agjenda
            </div>
        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <div class="topbar">

            <div>
                <div class="page-title">
                    Agjenda e Vizitave
                </div>

                <div class="page-subtitle">
                    Menaxhimi ditor i vizitave të ambulatorit
                </div>
            </div>

            <div class="user-box">
                AMBULATORI GVM
            </div>

        </div>


        <!-- =================================================
             DATE NAVIGATION
        ================================================== -->

        <div class="date-navigation">

            <button id="prevDate" type="button">
                ‹
            </button>

            <div class="date-center">

                <div
                    id="selectedDateLabel"
                    class="date-main">
                    -
                </div>

                <div
                    id="selectedDateSmall"
                    class="date-small">
                    -
                </div>

            </div>

            <button id="nextDate" type="button">
                ›
            </button>

        </div>


        <!-- =================================================
             STATS
        ================================================== -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-label">
                    Gjithsej
                </div>

                <div
                    class="stat-value"
                    id="statTotal">
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Vizita
                </div>

                <div
                    class="stat-value"
                    id="statVisits">
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Rikontrolle
                </div>

                <div
                    class="stat-value"
                    id="statRechecks">
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Të anulluara
                </div>

                <div
                    class="stat-value"
                    id="statCancelled">
                    0
                </div>
            </div>

        </div>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message">
        </div>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <div class="workspace">


            <!-- =============================================
                 FORM
            ============================================== -->

            <section class="card">

                <div class="card-title">
                    <span class="title-icon">＋</span>
                    Shto Vizitë të Re
                </div>


                <label for="patientName">
                    Emër + Mbiemër *
                </label>

                <input
                    type="text"
                    id="patientName"
                    placeholder="Shkruani emrin dhe mbiemrin"
                    autocomplete="off"
                >


                <label for="visitType">
                    Lloji i vizitës *
                </label>

                <select id="visitType">

                    <option value="Vizitë">
                        Vizitë
                    </option>

                    <option value="Rikontroll">
                        Rikontroll
                    </option>

                </select>


                <div id="paymentBox">

                    <label>
                        Pagesa (vetëm për Rikontroll)
                    </label>

                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="Me pagesë"
                        >

                        <span>
                            Me pagesë
                        </span>

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="Pa pagesë"
                        >

                        <span>
                            Pa pagesë
                        </span>

                    </label>

                </div>


                <label for="cardNumber">

                    Nr. kartelës

                    <span
                        style="
                        font-weight:500;
                        color:#8aa0aa;
                        ">
                        (opsionale)
                    </span>

                </label>

                <input
                    type="text"
                    id="cardNumber"
                    placeholder="Shkruani nr. e kartelës"
                    autocomplete="off"
                >


                <label for="appointmentTime">
                    Orari *
                </label>

                <select id="appointmentTime">

                    <option value="">
                        Zgjidh orën
                    </option>

                </select>


                <button
                    id="saveButton"
                    type="button">

                    ＋ &nbsp; Ruaj Vizitën

                </button>

            </section>


            <!-- =============================================
                 AGENDA
            ============================================== -->

            <section class="card agenda-card">

                <div class="agenda-header">

                    <div class="agenda-title">
                        Agjenda e ditës
                    </div>

                    <div class="search-box">

                        <input
                            type="text"
                            id="agendaSearch"
                            placeholder="Kërko emër ose kartelë..."
                            autocomplete="off"
                        >

                    </div>

                </div>


                <div
                    id="agendaList"
                    class="agenda-list">

                </div>

            </section>

        </div>

    </main>

</div>


<!-- =========================================================
     EDIT MODAL
========================================================== -->

<div
    id="editModal"
    class="modal-overlay">

    <div class="modal">

        <div class="modal-title">
            Ndrysho Vizitën
        </div>


        <label for="editPatientName">
            Emër + Mbiemër
        </label>

        <input
            type="text"
            id="editPatientName"
            autocomplete="off"
        >


        <label for="editVisitType">
            Lloji i vizitës
        </label>

        <select id="editVisitType">

            <option value="Vizitë">
                Vizitë
            </option>

            <option value="Rikontroll">
                Rikontroll
            </option>

        </select>


        <div id="editPaymentBox">

            <label>
                Pagesa
            </label>

            <label class="payment-option">

                <input
                    type="radio"
                    name="editPayment"
                    value="Me pagesë"
                >

                <span>
                    Me pagesë
                </span>

            </label>

            <label class="payment-option">

                <input
                    type="radio"
                    name="editPayment"
                    value="Pa pagesë"
                >

                <span>
                    Pa pagesë
                </span>

            </label>

        </div>


        <label for="editCardNumber">
            Nr. kartelës
        </label>

        <input
            type="text"
            id="editCardNumber"
            autocomplete="off"
        >


        <label for="editAppointmentTime">
            Orari
        </label>

        <select id="editAppointmentTime">

        </select>


        <div class="modal-actions">

            <button
                type="button"
                class="btn-secondary"
                id="cancelEditButton">

                Anullo

            </button>

            <button
                type="button"
                class="btn-primary"
                id="saveEditButton">

                Ruaj ndryshimet

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     DELETE CONFIRMATION MODAL
========================================================== -->

<div
    id="deleteConfirmModal"
    class="modal-overlay">

    <div class="modal">

        <div class="modal-title">
            Fshi vizitën
        </div>

        <div
            style="
            color:#607985;
            font-size:13px;
            line-height:1.5;
            ">

            Jeni të sigurt që dëshironi ta fshini këtë vizitë?

        </div>


        <div class="modal-actions">

            <button
                type="button"
                class="btn-secondary"
                onclick="closeDeleteConfirm()">

                Jo, kthehu

            </button>

            <button
                type="button"
                class="btn-danger"
                onclick="confirmDeleteVisit()">

                Po, fshi

            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const patientName =
    document.getElementById("patientName");

const visitType =
    document.getElementById("visitType");

const paymentBox =
    document.getElementById("paymentBox");

const cardNumber =
    document.getElementById("cardNumber");

const appointmentTime =
    document.getElementById("appointmentTime");

const saveButton =
    document.getElementById("saveButton");

const agendaList =
    document.getElementById("agendaList");

const messageBox =
    document.getElementById("message");

const agendaSearch =
    document.getElementById("agendaSearch");

const selectedDateLabel =
    document.getElementById("selectedDateLabel");

const selectedDateSmall =
    document.getElementById("selectedDateSmall");

const statTotal =
    document.getElementById("statTotal");

const statVisits =
    document.getElementById("statVisits");

const statRechecks =
    document.getElementById("statRechecks");

const statCancelled =
    document.getElementById("statCancelled");


/* =========================================================
   DATE
========================================================= */

let selectedDate =
    new Date();


function dateToString(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function formatDateLong(date){

    const days = [
        "E diel",
        "E hënë",
        "E martë",
        "E mërkurë",
        "E enjte",
        "E premte",
        "E shtunë"
    ];

    const months = [
        "Janar",
        "Shkurt",
        "Mars",
        "Prill",
        "Maj",
        "Qershor",
        "Korrik",
        "Gusht",
        "Shtator",
        "Tetor",
        "Nëntor",
        "Dhjetor"
    ];

    return (
        days[date.getDay()] +
        ", " +
        date.getDate() +
        " " +
        months[date.getMonth()] +
        " " +
        date.getFullYear()
    );
}


function updateDateDisplay(){

    selectedDateLabel.textContent =
        formatDateLong(selectedDate);

    selectedDateSmall.textContent =
        dateToString(selectedDate);

}


/* =========================================================
   TIME OPTIONS
========================================================= */

function createTimeOptions(){

    appointmentTime.innerHTML =
        '<option value="">Zgjidh orën</option>';

    for(
        let minutes = 12 * 60;
        minutes <= 17 * 60;
        minutes += 15
    ){

        const hour =
            String(
                Math.floor(minutes / 60)
            ).padStart(2,"0");

        const minute =
            String(
                minutes % 60
            ).padStart(2,"0");

        const value =
            `${hour}:${minute}:00`;

        const label =
            `${hour}:${minute}`;

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = label;

        appointmentTime.appendChild(option);
    }
}


/* =========================================================
   PAYMENT
========================================================= */

visitType.addEventListener(
    "change",
    function(){

        if(
            visitType.value === "Rikontroll"
        ){

            paymentBox.style.display =
                "block";

        }else{

            paymentBox.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="payment"]'
                )
                .forEach(function(radio){

                    radio.checked = false;

                });
        }

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    message,
    type = "success"
){

    messageBox.textContent =
        message;

    messageBox.className =
        "message show " + type;

    setTimeout(
        function(){

            messageBox.className =
                "message";

        },
        3500
    );
}


/* =========================================================
   SAVE VISIT
========================================================= */

async function saveVisit(){

    const name =
        patientName.value.trim();

    const type =
        visitType.value;

    const card =
        cardNumber.value.trim();

    const time =
        appointmentTime.value;

    let payment = null;

    if(type === "Rikontroll"){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );

        if(!selectedPayment){

            showMessage(
                "Zgjidhni Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }

        payment =
            selectedPayment.value;
    }


    if(!name){

        showMessage(
            "Vendosni emrin dhe mbiemrin.",
            "error"
        );

        return;
    }


    if(!time){

        showMessage(
            "Zgjidhni orarin.",
            "error"
        );

        return;
    }


    saveButton.disabled =
        true;

    saveButton.textContent =
        "Po ruhet...";


    const date =
        dateToString(selectedDate);


    const result =
        await db
            .from("appointments")
            .insert({
                appointment_date: date,
                appointment_time: time,
                patient_name: name,
                card_number: card || null,
                visit_type: type,
                payment_status: payment,
                status: "scheduled"
            });


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

    }else{

        showMessage(
            "Vizita u ruajt me sukses.",
            "success"
        );

        patientName.value =
            "";

        cardNumber.value =
            "";

        appointmentTime.value =
            "";

        visitType.value =
            "Vizitë";

        paymentBox.style.display =
            "none";

        document
            .querySelectorAll(
                'input[name="payment"]'
            )
            .forEach(function(radio){

                radio.checked =
                    false;

            });

        await loadVisits();
    }


    saveButton.disabled =
        false;

    saveButton.innerHTML =
        "＋ &nbsp; Ruaj Vizitën";
}


/* =========================================================
   LOAD VISITS
========================================================= */

async function loadVisits(){

    agendaList.innerHTML =
        "";


    const date =
        dateToString(selectedDate);


    const result =
        await db
            .from("appointments")
            .select(
                "id, appointment_date, appointment_time, patient_name, card_number, visit_type, payment_status, status"
            )
            .eq(
                "appointment_date",
                date
            )
            .order(
                "appointment_time",
                {
                    ascending:true
                }
            );


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    const visits =
        result.data || [];


    updateStats(visits);


    const search =
        agendaSearch.value
            .trim()
            .toLowerCase();


    const filteredVisits =
        search
            ? visits.filter(
                function(visit){

                    return (
                        String(
                            visit.patient_name || ""
                        )
                        .toLowerCase()
                        .includes(search)
                        ||
                        String(
                            visit.card_number || ""
                        )
                        .toLowerCase()
                        .includes(search)
                    );

                }
            )
            : visits;


    const visitByTime = {};


    filteredVisits.forEach(
        function(visit){

            let time =
                visit.appointment_time;

            if(time && time.length >= 5){
                time =
                    time.substring(0,5);
            }

            visitByTime[time] =
                visit;
        }
    );


    for(
        let minutes = 12 * 60;
        minutes <= 17 * 60;
        minutes += 15
    ){

        const hour =
            String(
                Math.floor(minutes / 60)
            ).padStart(2,"0");

        const minute =
            String(
                minutes % 60
            ).padStart(2,"0");

        const time =
            `${hour}:${minute}`;


        const slot =
            document.createElement("div");

        slot.className =
            "slot";


        const visit =
            visitByTime[time];


        if(!visit){

            const empty =
                document.createElement("div");

            empty.className =
                "slot-empty";

            empty.innerHTML =
                `<span>${time}</span>`;

            slot.appendChild(
                empty
            );

        }else{

            const item =
                document.createElement("div");

            item.className =
                "visit-item";


            if(
                visit.status === "arrived"
            ){

                item.style.borderLeftColor =
                    "#28a66b";

            }else if(
                visit.status === "finished"
            ){

                item.style.borderLeftColor =
                    "#3e7ac8";

            }else if(
                visit.status === "cancelled"
            ){

                item.style.borderLeftColor =
                    "#c23a3a";

            }


            /* TIME */

            const timeEl =
                document.createElement("div");

            timeEl.className =
                "visit-time";

            timeEl.textContent =
                time;


            /* PATIENT */

            const patient =
                document.createElement("div");

            patient.className =
                "visit-patient";


            const patientNameEl =
                document.createElement("div");

            patientNameEl.className =
                "patient-name";

            patientNameEl.textContent =
                visit.patient_name || "-";


            const cardEl =
                document.createElement("div");

            cardEl.className =
                "patient-card";

            cardEl.textContent =
                visit.card_number
                    ? "Kartela: " +
                      visit.card_number
                    : "Pa nr. kartelë";


            patient.appendChild(
                patientNameEl
            );

            patient.appendChild(
                cardEl
            );


            /* TYPE */

            const typeEl =
                document.createElement("div");

            typeEl.className =
                "visit-type";

            typeEl.textContent =
                visit.visit_type || "-";


            if(
                visit.visit_type ===
                "Rikontroll"
                &&
                visit.payment_status
            ){

                const paymentEl =
                    document.createElement("div");

                paymentEl.className =
                    "visit-payment";

                paymentEl.textContent =
                    visit.payment_status;

                typeEl.appendChild(
                    paymentEl
                );
            }


            /* CONTROLS */

            const controls =
                document.createElement("div");

            controls.className =
                "visit-status-controls";


            const arrived =
                document.createElement("button");

            arrived.type =
                "button";

            arrived.className =
                "visit-status-button arrived";

            arrived.textContent =
                "✓ Ka ardhur";


            const finished =
                document.createElement("button");

            finished.type =
                "button";

            finished.className =
                "visit-status-button finished";

            finished.textContent =
                "✓ Ka mbaruar";


            const cancelled =
                document.createElement("button");

            cancelled.type =
                "button";

            cancelled.className =
                "visit-status-button cancelled";

            cancelled.textContent =
                "Anullo";


            const editButton =
                document.createElement("button");

            editButton.type =
                "button";

            editButton.className =
                "visit-status-button";

            editButton.textContent =
                "✎ Ndrysho";


            const deleteButton =
                document.createElement("button");

            deleteButton.type =
                "button";

            deleteButton.className =
                "visit-delete-button";

            deleteButton.textContent =
                "Fshi vizitën";


            arrived.addEventListener(
                "click",
                function(){

                    updateVisitStatus(
                        visit.id,
                        "arrived"
                    );

                }
            );


            finished.addEventListener(
                "click",
                function(){

                    updateVisitStatus(
                        visit.id,
                        "finished"
                    );

                }
            );


            cancelled.addEventListener(
                "click",
                function(){

                    updateVisitStatus(
                        visit.id,
                        "cancelled"
                    );

                }
            );


            editButton.addEventListener(
                "click",
                function(){

                    openEditModal(
                        visit
                    );

                }
            );


            /*
             * KORRIGJIMI:
             * Hapim modalin e konfirmimit
             * në vend të deleteVisit()
             */

            deleteButton.addEventListener(
                "click",
                function(){

                    openDeleteConfirm(
                        visit.id
                    );

                }
            );


            controls.appendChild(
                arrived
            );

            controls.appendChild(
                finished
            );

            controls.appendChild(
                cancelled
            );

            controls.appendChild(
                editButton
            );

            controls.appendChild(
                deleteButton
            );


            item.appendChild(
                timeEl
            );

            item.appendChild(
                patient
            );

            item.appendChild(
                typeEl
            );

            item.appendChild(
                controls
            );


            slot.appendChild(
                item
            );
        }


        agendaList.appendChild(
            slot
        );
    }
}


/* =========================================================
   STATS
========================================================= */

function updateStats(visits){

    statTotal.textContent =
        visits.length;


    statVisits.textContent =
        visits.filter(
            function(v){
                return v.visit_type === "Vizitë";
            }
        ).length;


    statRechecks.textContent =
        visits.filter(
            function(v){
                return v.visit_type === "Rikontroll";
            }
        ).length;


    statCancelled.textContent =
        visits.filter(
            function(v){
                return v.status === "cancelled";
            }
        ).length;
}


/* =========================================================
   UPDATE STATUS
========================================================= */

async function updateVisitStatus(
    id,
    status
){

    const result =
        await db
            .from("appointments")
            .update({
                status:status
            })
            .eq(
                "id",
                id
            );


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    await loadVisits();
}


/* =========================================================
   DELETE CONFIRMATION
========================================================= */

let pendingDeleteId =
    null;


function openDeleteConfirm(id){

    pendingDeleteId =
        id;

    const modal =
        document.getElementById(
            "deleteConfirmModal"
        );

    if(modal){

        modal.classList.add(
            "show"
        );
    }
}


function closeDeleteConfirm(){

    pendingDeleteId =
        null;

    const modal =
        document.getElementById(
            "deleteConfirmModal"
        );

    if(modal){

        modal.classList.remove(
            "show"
        );
    }
}


async function confirmDeleteVisit(){

    if(!pendingDeleteId){
        return;
    }


    const id =
        pendingDeleteId;


    closeDeleteConfirm();


    const result =
        await db
            .from("appointments")
            .delete()
            .eq(
                "id",
                id
            );


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Vizita u fshi.",
        "success"
    );


    await loadVisits();
}


/* =========================================================
   EDIT MODAL
========================================================= */

let editingVisitId =
    null;


const editModal =
    document.getElementById(
        "editModal"
    );

const editPatientName =
    document.getElementById(
        "editPatientName"
    );

const editVisitType =
    document.getElementById(
        "editVisitType"
    );

const editPaymentBox =
    document.getElementById(
        "editPaymentBox"
    );

const editCardNumber =
    document.getElementById(
        "editCardNumber"
    );

const editAppointmentTime =
    document.getElementById(
        "editAppointmentTime"
    );


function createEditTimeOptions(){

    editAppointmentTime.innerHTML =
        "";

    for(
        let minutes = 12 * 60;
        minutes <= 17 * 60;
        minutes += 15
    ){

        const hour =
            String(
                Math.floor(minutes / 60)
            ).padStart(2,"0");

        const minute =
            String(
                minutes % 60
            ).padStart(2,"0");

        const value =
            `${hour}:${minute}:00`;

        const option =
            document.createElement(
                "option"
            );

        option.value =
            value;

        option.textContent =
            `${hour}:${minute}`;

        editAppointmentTime.appendChild(
            option
        );
    }
}


function updateEditPaymentBox(){

    if(
        editVisitType.value ===
        "Rikontroll"
    ){

        editPaymentBox.style.display =
            "block";

    }else{

        editPaymentBox.style.display =
            "none";

        document
            .querySelectorAll(
                'input[name="editPayment"]'
            )
            .forEach(
                function(radio){

                    radio.checked =
                        false;

                }
            );
    }
}


editVisitType.addEventListener(
    "change",
    updateEditPaymentBox
);


function openEditModal(visit){

    editingVisitId =
        visit.id;


    editPatientName.value =
        visit.patient_name || "";


    editVisitType.value =
        visit.visit_type || "Vizitë";


    editCardNumber.value =
        visit.card_number || "";


    editAppointmentTime.value =
        visit.appointment_time;


    updateEditPaymentBox();


    if(
        visit.payment_status
    ){

        const radio =
            document.querySelector(
                'input[name="editPayment"][value="' +
                visit.payment_status +
                '"]'
            );

        if(radio){
            radio.checked =
                true;
        }
    }


    editModal.classList.add(
        "show"
    );
}


function closeEditModal(){

    editingVisitId =
        null;

    editModal.classList.remove(
        "show"
    );
}


document
    .getElementById(
        "cancelEditButton"
    )
    .addEventListener(
        "click",
        closeEditModal
    );


document
    .getElementById(
        "saveEditButton"
    )
    .addEventListener(
        "click",
        async function(){

            if(!editingVisitId){
                return;
            }


            const name =
                editPatientName.value.trim();

            const type =
                editVisitType.value;

            const card =
                editCardNumber.value.trim();

            const time =
                editAppointmentTime.value;


            let payment = null;


            if(type === "Rikontroll"){

                const selected =
                    document.querySelector(
                        'input[name="editPayment"]:checked'
                    );


                if(!selected){

                    showMessage(
                        "Zgjidhni Me pagesë ose Pa pagesë.",
                        "error"
                    );

                    return;
                }


                payment =
                    selected.value;
            }


            if(!name){

                showMessage(
                    "Vendosni emrin dhe mbiemrin.",
                    "error"
                );

                return;
            }


            const result =
                await db
                    .from("appointments")
                    .update({
                        appointment_time:time,
                        patient_name:name,
                        card_number:card || null,
                        visit_type:type,
                        payment_status:payment
                    })
                    .eq(
                        "id",
                        editingVisitId
                    );


            if(result.error){

                console.error(
                    result.error
                );

                showMessage(
                    result.error.message,
                    "error"
                );

                return;
            }


            closeEditModal();


            showMessage(
                "Ndryshimet u ruajtën.",
                "success"
            );


            await loadVisits();
        }
    );


/* =========================================================
   DATE NAVIGATION
========================================================= */

document
    .getElementById(
        "prevDate"
    )
    .addEventListener(
        "click",
        async function(){

            selectedDate.setDate(
                selectedDate.getDate() - 1
            );

            updateDateDisplay();

            await loadVisits();
        }
    );


document
    .getElementById(
        "nextDate"
    )
    .addEventListener(
        "click",
        async function(){

            selectedDate.setDate(
                selectedDate.getDate() + 1
            );

            updateDateDisplay();

            await loadVisits();
        }
    );


/* =========================================================
   SEARCH
========================================================= */

agendaSearch.addEventListener(
    "input",
    function(){

        loadVisits();

    }
);


/* =========================================================
   SAVE BUTTON
========================================================= */

saveButton.addEventListener(
    "click",
    saveVisit
);


/* =========================================================
   START
========================================================= */

createTimeOptions();

createEditTimeOptions();

updateDateDisplay();

loadVisits();

</script>

</body>
</html>
