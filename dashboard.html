<div class="container">

    <header class="hospital-header">

</header>

    <div id="message"></div>

    <!-- FORMULARI -->

    <div class="card">

        <label for="patientName">
            Emër Mbiemër
        </label>

        <input
            type="text"
            id="patientName"
            placeholder="Emër Mbiemër"
            autocomplete="off"
        >

        <label for="cardNumber">
            Nr. Kartelës
        </label>

        <input
            type="text"
            id="cardNumber"
            placeholder="Nr. Kartelës"
            autocomplete="off"
        >

        <label for="visitType">
            Lloji i vizitës
        </label>

        <select id="visitType">

            <option value="Vizitë">
                Vizitë
            </option>

            <option value="Rikontroll">
                Rikontroll
            </option>

        </select>

        <!-- PAGESA -->

        <div id="paymentBox">

            <label>

                <input
                    type="radio"

                >

        id="todayDate"

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTET
========================================================= */

const patientName =
    document.getElementById("patientName");

const cardNumber =
    document.getElementById("cardNumber");

const visitType =
    document.getElementById("visitType");

const paymentBox =
    document.getElementById("paymentBox");

const appointmentTime =
    document.getElementById("appointmentTime");

const saveButton =
    document.getElementById("saveButton");

const visits =
    document.getElementById("visits");

const message =
    document.getElementById("message");

const todayDate =
    document.getElementById("todayDate");


/* =========================================================
   DATA E SOTME
========================================================= */

function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =========================================================
   SHFAQ DATEN
========================================================= */

function showTodayDate(){

    const now = new Date();

    const formatted =
        now.toLocaleDateString(
            "sq-AL",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

    todayDate.textContent =
        formatted;

}


/* =========================================================
   KRIJO ORARET
========================================================= */

function createTimeOptions(){

    appointmentTime.innerHTML =
        '<option value="">Zgjidh orën</option>';

    for(
        let hour = 12;
        hour <= 17;
        hour++
    ){

        for(
            let minute = 0;
            minute < 60;
            minute += 15
        ){

            if(
                hour === 17 &&
                minute > 0
            ){
                continue;
            }

            const time =
                String(hour).padStart(2,"0")
                +
                ":"
                +
                String(minute).padStart(2,"0");

            const option =
                document.createElement("option");

            option.value =
                time;

            option.textContent =
                time;

            appointmentTime.appendChild(
                option
            );
        }
    }

}


/* =========================================================
   SHOW / HIDE PAGESEN
========================================================= */

visitType.addEventListener(
    "change",
    function(){

        if(
            visitType.value ===
            "Rikontroll"
        ){

            paymentBox.style.display =
                "block";

        }
        else{

            paymentBox.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="payment"]'
                )
                .forEach(
                    function(radio){
                        radio.checked =
                            false;
                    }
                );
        }

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "";

    if(type === "success"){

        message.classList.add(
            "message-success"
        );

    }
    else{

        message.classList.add(
            "message-error"
        );

    }

    setTimeout(
        function(){

            message.style.display =
                "none";

            message.className =
                "";

        },
        5000
    );

}


/* =========================================================
   RUAJ VIZITEN
========================================================= */

async function saveVisit(){

    const name =
        patientName.value.trim();

    const card =
        cardNumber.value.trim();

    const type =
        visitType.value;

    const time =
        appointmentTime.value;

    let payment =
        null;


    /* VALIDIM */

    if(!name){

        showMessage(
            "Vendos Emër Mbiemër.",
            "error"
        );

        patientName.focus();

        return;
    }


    if(!time){

        showMessage(
            "Zgjidh orën e vizitës.",
            "error"
        );

        appointmentTime.focus();

        return;
    }


    /* PAGESA VETEM PER RIKONTROLL */

    if(type === "Rikontroll"){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );

        if(!selectedPayment){

            showMessage(
                "Zgjidh Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }

        payment =
            selectedPayment.value;

    }


    const date =
        getToday();


    /* DISABLE BUTTON */

    saveButton.disabled =
        true;

    saveButton.textContent =
        "Po ruhet...";


    console.log(
        "Po ruhet vizita:",
        {
            appointment_date:date,
            appointment_time:time,
            patient_name:name,
            card_number:card || null,
            visit_type:type,
            payment_status:payment
        }
    );


    /* INSERT SUPABASE */

    const result =
        await db
            .from("appointments")
            .insert({
                appointment_date: date,
                appointment_time: time,
                patient_name: name,
                card_number: card || null,
                visit_type: type,
                payment_status: payment
            });


    console.log(
        "Supabase result:",
        result
    );


    /* GABIM */

    if(result.error){

        console.error(
            "SUPABASE INSERT ERROR:",
            result.error
        );

        showMessage(
            "Gabim Supabase: " +
            result.error.message,
            "error"
        );

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Ruaj Vizitën";

        return;
    }


    /* SUKSES */

    showMessage(
        "Vizita u ruajt me sukses.",
        "success"
    );


    /* PASTRO FORMULAREN */

    patientName.value =
        "";

    cardNumber.value =
        "";

    appointmentTime.value =
        "";

    visitType.value =
        "Vizitë";

    paymentBox.style.display =
        "none";


    document
        .querySelectorAll(
            'input[name="payment"]'
        )
        .forEach(
            function(radio){

                radio.checked =
                    false;

            }
        );


    saveButton.disabled =
        false;

    saveButton.textContent =
        "Ruaj Vizitën";


    /* RINGARKO LISTEN */

    await loadVisits();

}


/* =========================================================
   NGARKO VIZITAT E SOTME
========================================================= */

async function loadVisits(){

    visits.innerHTML =
        '<div class="loading">Po ngarkohen vizitat...</div>';


    const date =
        getToday();


    const result =
        await db
            .from("appointments")
            .select(
                "id, appointment_date, appointment_time, patient_name, card_number, visit_type, payment_status"
            )
            .eq(
                "appointment_date",
                date
            )
            .order(
                "appointment_time",
                {
                    ascending:true
                }
            );


    console.log(
        "LOAD VISITS:",
        result
    );


    if(result.error){

        console.error(
            "SUPABASE SELECT ERROR:",
            result.error
        );

        visits.innerHTML = "";

        const errorBox =
            document.createElement("div");

        errorBox.className =
            "empty";

        errorBox.innerHTML =
            "<strong>Gabim gjatë ngarkimit</strong><br><br>" +
            result.error.message;

        visits.appendChild(
            errorBox
        );

        return;
    }


    const data =
        result.data || [];


    if(data.length === 0){

        visits.innerHTML =
            '<div class="empty">' +
            'Nuk ka vizita të regjistruara për sot.' +
            '</div>';

        return;
    }


    visits.innerHTML =
        "";


    data.forEach(
        function(visit){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "visit-item";


            /* ORA */

            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "visit-time";

            time.textContent =
                visit.appointment_time
                    ? String(
                        visit.appointment_time
                    ).substring(0,5)
                    : "--:--";


            /* EMRI */

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "visit-name";

            name.textContent =
                visit.patient_name ||
                "";


            /* KARTELA */

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "visit-line";

            card.innerHTML =
                "<strong>Nr. Kartelës:</strong> " +
                (
                    visit.card_number ||
                    "—"
                );


            /* LLOJI */

            const type =
                document.createElement(
                    "span"
                );

            type.className =
                "visit-type";

            type.textContent =
                visit.visit_type ||
                "Vizitë";


            /* KONTAINER PER TIP + PAGESEN */

            const statusLine =
                document.createElement(
                    "div"
                );

            statusLine.appendChild(
                type
            );


            /* PAGESA */

            if(
                visit.visit_type ===
                "Rikontroll"
            ){

                const payment =
                    document.createElement(
                        "span"
                    );


                if(
                    visit.payment_status ===
                    "Me pagesë"
                ){

                    payment.className =
                        "payment-paid";

                    payment.textContent =
                        "Me pagesë";

                }
                else if(
                    visit.payment_status ===
                    "Pa pagesë"
                ){

                    payment.className =
                        "payment-free";

                    payment.textContent =
                        "Pa pagesë";

                }
                else{

                    payment.className =
                        "payment-paid";

                    payment.textContent =
                        "Pagesa nuk është zgjedhur";

                }


                statusLine.appendChild(
                    payment
                );

            }


            /* BUTONI FSHI */

            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-button";

            deleteButton.type =
                "button";

            deleteButton.textContent =
                "Fshi vizitën";


            deleteButton.addEventListener(
                "click",
                function(){

                    deleteVisit(
                        visit.id
                    );

                }
            );


            /* SHTO ELEMENTET */

            item.appendChild(
                time
            );

            item.appendChild(
                name
            );

            item.appendChild(
                card
            );

            item.appendChild(
                statusLine
            );

            item.appendChild(
                deleteButton
            );


            visits.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   FSHI VIZITEN
========================================================= */

async function deleteVisit(
    id
){

    const confirmed =
        confirm(
            "A dëshiron ta fshish këtë vizitë?"
        );


    if(!confirmed){
        return;
    }


    const result =
        await db
            .from("appointments")
            .delete()
            .eq(
                "id",
                id
            );


    console.log(
        "DELETE RESULT:",
        result
    );


    if(result.error){

        console.error(
            "SUPABASE DELETE ERROR:",
            result.error
        );

        showMessage(
            "Gabim gjatë fshirjes: " +
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Vizita u fshi.",
        "success"
    );


    await loadVisits();

}


/* =========================================================
   START
========================================================= */

showTodayDate();

createTimeOptions();

loadVisits();

</script>

</body>
