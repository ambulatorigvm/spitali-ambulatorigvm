<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agjenda | AMBULATORI GVM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1769aa;
      --blue-dark: #0f4f82;
      --blue-light: #eaf4fb;
      --border: #dce6ee;
      --text: #1f2d3d;
      --muted: #718096;
      --white: #ffffff;
      --green: #2e9b68;
      --green-light: #eaf8f1;
      --orange: #d98a22;
      --orange-light: #fff5e6;
      --shadow: 0 10px 30px rgba(31, 55, 75, 0.08);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f8fb;
      color: var(--text);
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =========================
       MAIN LAYOUT
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 245px;
      min-width: 245px;
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e2e9ef;
      padding: 26px 18px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 20;
    }

    .brand {
      padding: 4px 12px 28px;
      border-bottom: 1px solid #edf1f4;
      margin-bottom: 24px;
    }

    .brand-main {
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.5px;
      color: #173b59;
    }

    .brand-sub {
      margin-top: 5px;
      font-size: 12px;
      letter-spacing: 1.2px;
      color: #8b9aa8;
      text-transform: uppercase;
    }

    .nav-title {
      padding: 0 12px 10px;
      color: #9aa8b5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #657686;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 10px;
      margin-bottom: 5px;
      cursor: pointer;
      text-align: left;
      transition: none;
    }

    .nav-item:hover {
      background: transparent;
      color: #657686;
    }

    .nav-item.active {
      background: #eaf4fb;
      color: var(--blue);
      font-weight: 650;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .sidebar-bottom {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 22px;
      padding: 14px;
      border-radius: 12px;
      background: #f7fafc;
      border: 1px solid #e6edf2;
    }

    .sidebar-bottom-title {
      font-size: 11px;
      color: #9aa8b5;
      margin-bottom: 5px;
    }

    .sidebar-bottom-text {
      font-size: 12px;
      color: #506273;
      font-weight: 600;
    }

    /* =========================
       CONTENT
    ========================= */

    .main {
      width: calc(100% - 245px);
      margin-left: 245px;
      min-height: 100vh;
      padding: 28px 34px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .page-title h1 {
      font-size: 27px;
      line-height: 1.2;
      color: #18364f;
      letter-spacing: -0.5px;
    }

    .page-title p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .today-button {
      border: 1px solid #d8e4ed;
      background: white;
      color: #31526c;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 600;
      transition: none;
    }

    .today-button:hover {
      background: white;
      border-color: #d8e4ed;
    }

    /* =========================
       DATE BAR
    ========================= */

    .date-panel {
      background: white;
      border: 1px solid #e1e9ef;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .date-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-title {
      font-size: 15px;
      font-weight: 700;
      color: #29465d;
    }

    .date-subtitle {
      font-size: 12px;
      color: #91a0ad;
    }

    .date-navigation {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .date-arrow {
      width: 34px;
      height: 34px;
      border: 1px solid #dce5ec;
      background: #fff;
      border-radius: 8px;
      color: #557086;
      cursor: pointer;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: none;
    }

    .date-arrow:hover {
      background: #fff;
      border-color: #dce5ec;
      color: #557086;
    }

    .dates {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .date-card {
      min-height: 76px;
      border: 1px solid #e1e8ee;
      background: #fff;
      border-radius: 11px;
      padding: 10px;
      cursor: pointer;
      text-align: left;
      transition: none;
    }

    .date-card:hover {
      border-color: #e1e8ee;
      background: #fff;
      transform: none;
      box-shadow: none;
    }

    .date-card.active {
      background: #eef7fc;
      border-color: #8fc1df;
    }

    .date-card.today {
      border-color: #a9cde3;
    }

    .date-weekday {
      color: #91a0ad;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .date-number {
      margin-top: 7px;
      font-size: 21px;
      line-height: 1;
      font-weight: 700;
      color: #2c475c;
    }

    .date-card.active .date-number {
      color: var(--blue);
    }

    .date-month {
      margin-top: 4px;
      color: #8c9aa6;
      font-size: 10px;
    }

    /* =========================
       CONTENT GRID
    ========================= */

    .content-grid {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* =========================
       FORM CARD
    ========================= */

    .card {
      background: white;
      border: 1px solid #e1e9ef;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .form-card {
      padding: 21px;
      position: sticky;
      top: 20px;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-heading h2 {
      font-size: 16px;
      color: #29465d;
    }

    .card-heading span {
      font-size: 11px;
      color: #98a6b2;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #607384;
    }

    .field input,
    .field select {
      width: 100%;
      height: 42px;
      border: 1px solid #dce5ec;
      border-radius: 9px;
      padding: 0 12px;
      outline: none;
      background: #fff;
      color: #2d4355;
      font-size: 13px;
    }

    .field input:focus,
    .field select:focus {
      border-color: #8bbbd8;
      box-shadow: 0 0 0 3px rgba(42, 126, 173, .08);
    }

    .visit-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .visit-option {
      position: relative;
    }

    .visit-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .visit-option label {
      height: 42px;
      margin: 0;
      border: 1px solid #dce5ec;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64798a;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: none;
    }

    .visit-option label:hover {
      border-color: #dce5ec;
      background: #fff;
    }

    .visit-option input:checked + label {
      border-color: #86b8d5;
      background: #edf7fc;
      color: #1769aa;
    }

    .payment-box {
      display: none;
      margin-top: 11px;
      padding: 12px;
      border: 1px solid #e6edf2;
      border-radius: 10px;
      background: #fafcfd;
    }

    .payment-box.visible {
      display: block;
    }

    .payment-title {
      font-size: 10px;
      font-weight: 700;
      color: #7b8c9b;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 8px;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .payment-option label {
      height: 38px;
      margin: 0;
      border: 1px solid #dce5ec;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #6b7d8b;
      cursor: pointer;
      transition: none;
    }

    .payment-option input:checked + label {
      background: #f2f8fc;
      border-color: #9fc4da;
      color: #1769aa;
    }

    .save-button {
      width: 100%;
      height: 44px;
      margin-top: 3px;
      border: 0;
      border-radius: 9px;
      background: #1769aa;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: none;
    }

    .save-button:hover {
      background: #1769aa;
    }

    .save-button:disabled {
      opacity: .65;
      cursor: default;
    }

    .message {
      display: none;
      margin-top: 11px;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      background: var(--green-light);
      color: #287a55;
      border: 1px solid #ccebdc;
    }

    .message.error {
      display: block;
      background: #fff1f1;
      color: #a04444;
      border: 1px solid #f0d0d0;
    }

    /* =========================
       AGENDA
    ========================= */

    .agenda-card {
      overflow: hidden;
    }

    .agenda-top {
      padding: 20px 21px;
      border-bottom: 1px solid #edf1f4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .agenda-top h2 {
      font-size: 16px;
      color: #29465d;
    }

    .agenda-top p {
      margin-top: 4px;
      font-size: 11px;
      color: #91a0ad;
    }

    .agenda-count {
      min-width: 34px;
      height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      background: #edf6fb;
      color: #1769aa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .agenda {
      width: 100%;
    }

    .appointment-row {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      min-height: 74px;
      border-bottom: 1px solid #edf2f5;
    }

    .appointment-row:last-child {
      border-bottom: 0;
    }

    .time-cell {
      padding: 17px 12px 17px 20px;
      color: #8293a0;
      font-size: 12px;
      font-weight: 650;
      border-right: 1px solid #edf2f5;
    }

    .appointment-cell {
      min-width: 0;
      padding: 11px 18px;
      display: flex;
      align-items: center;
    }

    .empty-slot {
      width: 100%;
      min-height: 48px;
      border: 1px dashed #e2e9ee;
      border-radius: 9px;
      display: flex;
      align-items: center;
      padding: 0 13px;
      color: #b0bbc4;
      font-size: 11px;
    }

    .appointment {
      width: 100%;
      min-height: 52px;
      border: 1px solid #dfe8ee;
      border-left: 4px solid #7bb4d3;
      border-radius: 9px;
      padding: 9px 12px;
      background: #fbfdfe;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .appointment-info {
      min-width: 0;
    }

    .appointment-name {
      font-size: 13px;
      font-weight: 700;
      color: #29465d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .appointment-meta {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      height: 21px;
      padding: 0 7px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag.visit {
      background: #eaf4fb;
      color: #2775a5;
    }

    .tag.payment {
      background: #edf8f2;
      color: #2e8960;
    }

    .tag.no-payment {
      background: #fff5e7;
      color: #b87822;
    }

    .card-number {
      font-size: 10px;
      color: #91a0ac;
    }

    .delete-button {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border: 1px solid #e4ebef;
      background: #fff;
      border-radius: 7px;
      color: #a1adb6;
      cursor: pointer;
      transition: none;
    }

    .delete-button:hover {
      background: #fff;
      border-color: #e4ebef;
      color: #a1adb6;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #91a0ad;
      font-size: 12px;
    }

    .no-data {
      padding: 42px 20px;
      text-align: center;
      color: #9ba8b2;
      font-size: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .form-card {
        position: static;
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 70px;
        min-width: 70px;
        padding: 20px 9px;
      }

      .brand {
        padding: 5px 0 20px;
        text-align: center;
      }

      .brand-main {
        font-size: 12px;
        line-height: 1.3;
      }

      .brand-sub,
      .nav-title,
      .nav-text,
      .sidebar-bottom {
        display: none;
      }

      .nav-item {
        justify-content: center;
        padding: 13px 8px;
      }

      .main {
        width: calc(100% - 70px);
        margin-left: 70px;
        padding: 20px 15px 30px;
      }

      .dates {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      .topbar {
        align-items: flex-start;
        gap: 12px;
      }

      .page-title h1 {
        font-size: 22px;
      }

      .today-button {
        font-size: 11px;
        padding: 9px 10px;
      }

      .dates {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .appointment-row {
        grid-template-columns: 67px minmax(0, 1fr);
      }

      .time-cell {
        padding-left: 12px;
      }

      .appointment-cell {
        padding: 9px 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-main">GVM</div>
      <div class="brand-sub">Care & Health</div>
    </div>

    <div class="nav-title">Menu</div>

    <button class="nav-item active" type="button">
      <span class="nav-icon">▦</span>
      <span class="nav-text">Agjenda</span>
    </button>

    <button class="nav-item" type="button" onclick="window.location.reload()">
      <span class="nav-icon">↻</span>
      <span class="nav-text">Rifresko</span>
    </button>

    <div class="sidebar-bottom">
      <div class="sidebar-bottom-title">Sistemi</div>
      <div class="sidebar-bottom-text">Agjenda e vizitave</div>
    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <div class="topbar">

      <div class="page-title">
        <h1>Agjenda</h1>
        <p>Menaxhimi i vizitave të planifikuara</p>
      </div>

      <button
        type="button"
        class="today-button"
        onclick="goToday()">
        Sot
      </button>

    </div>


    <!-- DATE PANEL -->
    <section class="date-panel">

      <div class="date-header">

        <div class="date-header-left">
          <div>
            <div class="date-title" id="selectedDateTitle">
              Agjenda
            </div>
            <div class="date-subtitle" id="selectedDateSubtitle">
              -
            </div>
          </div>
        </div>

        <div class="date-navigation">
          <button
            type="button"
            class="date-arrow"
            onclick="changeDate(-1)"
            aria-label="Dita e mëparshme">
            ‹
          </button>

          <button
            type="button"
            class="date-arrow"
            onclick="changeDate(1)"
            aria-label="Dita tjetër">
            ›
          </button>
        </div>

      </div>

      <div class="dates" id="dateCards"></div>

    </section>


    <!-- MAIN GRID -->
    <div class="content-grid">


      <!-- NEW APPOINTMENT -->
      <section class="card form-card">

        <div class="card-heading">
          <h2>Vizitë e re</h2>
          <span id="formDateLabel"></span>
        </div>


        <form id="appointmentForm">

          <div class="field">

            <label for="patientName">
              Emër + Mbiemër
            </label>

            <input
              id="patientName"
              type="text"
              autocomplete="off"
              placeholder="Shkruani emrin dhe mbiemrin"
              required>

          </div>


          <div class="field">

            <label>
              Lloji i vizitës
            </label>

            <div class="visit-options">

              <div class="visit-option">

                <input
                  type="radio"
                  id="visitNew"
                  name="visitType"
                  value="Vizitë"
                  checked>

                <label for="visitNew">
                  Vizitë
                </label>

              </div>


              <div class="visit-option">

                <input
                  type="radio"
                  id="visitControl"
                  name="visitType"
                  value="Rikontroll">

                <label for="visitControl">
                  Rikontroll
                </label>

              </div>

            </div>


            <!-- PAYMENT -->
            <div
              class="payment-box"
              id="paymentBox">

              <div class="payment-title">
                Pagesa e rikontrollit
              </div>

              <div class="payment-options">

                <div class="payment-option">

                  <input
                    type="radio"
                    id="paymentYes"
                    name="paymentStatus"
                    value="Me pagesë">

                  <label for="paymentYes">
                    Me pagesë
                  </label>

                </div>


                <div class="payment-option">

                  <input
                    type="radio"
                    id="paymentNo"
                    name="paymentStatus"
                    value="Pa pagesë">

                  <label for="paymentNo">
                    Pa pagesë
                  </label>

                </div>

              </div>

            </div>

          </div>


          <div class="field">

            <label for="cardNumber">
              Nr. kartele
              <span style="font-weight:400;color:#9ba8b2;">
                (opsional)
              </span>
            </label>

            <input
              id="cardNumber"
              type="text"
              autocomplete="off"
              placeholder="Nr. i kartelës">

          </div>


          <div class="field">

            <label for="appointmentTime">
              Orari
            </label>

            <select id="appointmentTime" required>
            </select>

          </div>


          <button
            class="save-button"
            id="saveButton"
            type="submit">

            Ruaj vizitën

          </button>


          <div
            id="formMessage"
            class="message">
          </div>

        </form>

      </section>


      <!-- AGENDA -->
      <section class="card agenda-card">

        <div class="agenda-top">

          <div>
            <h2>Vizitat e planifikuara</h2>
            <p id="agendaDateText">
              -
            </p>
          </div>

          <div
            class="agenda-count"
            id="appointmentCount">
            0
          </div>

        </div>

        <div
          class="agenda"
          id="agenda">

          <div class="loading">
            Po ngarkohet agjenda...
          </div>

        </div>

      </section>

    </div>

  </main>

</div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://ubpteaqdkxcriqyaxrux.supabase.co";

/*
  Vendos këtu ANON KEY-un të projektit tënd Supabase.
  Nëse në versionin tënd ekzistues ke një anon key tjetër,
  zëvendëso vetëm vlerën më poshtë.
*/
const SUPABASE_ANON_KEY = "VENDOS_ANON_KEY_KETU";


/* =========================================================
   SUPABASE REQUEST HELPER
========================================================= */

async function supabaseRequest(endpoint, options = {}) {

  const headers = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation",
    ...(options.headers || {})
  };

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + endpoint,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch (e) {
    data = text;
  }

  if (!response.ok) {

    let message = "Gabim gjatë komunikimit me Supabase.";

    if (data && data.message) {
      message = data.message;
    } else if (data && data.error) {
      message = data.error;
    } else if (typeof data === "string" && data) {
      message = data;
    }

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   STATE
========================================================= */

let selectedDate = new Date();

let appointments = [];

const TIME_START_HOUR = 12;
const TIME_END_HOUR = 17;
const TIME_INTERVAL = 15;


/* =========================================================
   DOM
========================================================= */

const dateCards = document.getElementById("dateCards");

const selectedDateTitle =
  document.getElementById("selectedDateTitle");

const selectedDateSubtitle =
  document.getElementById("selectedDateSubtitle");

const formDateLabel =
  document.getElementById("formDateLabel");

const agendaDateText =
  document.getElementById("agendaDateText");

const agenda =
  document.getElementById("agenda");

const appointmentCount =
  document.getElementById("appointmentCount");

const appointmentForm =
  document.getElementById("appointmentForm");

const patientName =
  document.getElementById("patientName");

const cardNumber =
  document.getElementById("cardNumber");

const appointmentTime =
  document.getElementById("appointmentTime");

const saveButton =
  document.getElementById("saveButton");

const formMessage =
  document.getElementById("formMessage");

const paymentBox =
  document.getElementById("paymentBox");

const visitNew =
  document.getElementById("visitNew");

const visitControl =
  document.getElementById("visitControl");

const paymentYes =
  document.getElementById("paymentYes");

const paymentNo =
  document.getElementById("paymentNo");


/* =========================================================
   DATE HELPERS
========================================================= */

function pad(number) {
  return String(number).padStart(2, "0");
}


function formatDateSQL(date) {

  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth() + 1) +
    "-" +
    pad(date.getDate())
  );

}


function parseDateSQL(value) {

  const parts = value.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


function formatDateLong(date) {

  return new Intl.DateTimeFormat(
    "sq-AL",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  ).format(date);

}


function formatDateShort(date) {

  return new Intl.DateTimeFormat(
    "sq-AL",
    {
      day: "numeric",
      month: "short"
    }
  ).format(date);

}


function isSameDate(a, b) {

  return (
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate()
  );

}


/* =========================================================
   DATE NAVIGATION
========================================================= */

function goToday() {

  selectedDate = new Date();

  renderDateCards();

  updateDateLabels();

  loadAppointments();

}


function changeDate(days) {

  const newDate = new Date(selectedDate);

  newDate.setDate(
    newDate.getDate() + days
  );

  selectedDate = newDate;

  renderDateCards();

  updateDateLabels();

  loadAppointments();

}


function selectDate(date) {

  selectedDate = new Date(date);

  renderDateCards();

  updateDateLabels();

  loadAppointments();

}


/* =========================================================
   DATE CARDS
========================================================= */

function renderDateCards() {

  dateCards.innerHTML = "";

  const start = new Date(selectedDate);

  /*
    Fill 7 days centered around selected date.
  */

  start.setDate(
    start.getDate() - 3
  );

  for (let i = 0; i < 7; i++) {

    const date = new Date(start);

    date.setDate(
      start.getDate() + i
    );

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "date-card";

    if (isSameDate(date, selectedDate)) {
      button.classList.add("active");
    }

    if (isSameDate(date, new Date())) {
      button.classList.add("today");
    }

    const weekday =
      new Intl.DateTimeFormat(
        "sq-AL",
        { weekday: "short" }
      ).format(date);

    const month =
      new Intl.DateTimeFormat(
        "sq-AL",
        { month: "short" }
      ).format(date);

    button.innerHTML = `
      <div class="date-weekday">
        ${weekday}
      </div>

      <div class="date-number">
        ${date.getDate()}
      </div>

      <div class="date-month">
        ${month}
      </div>
    `;

    button.addEventListener(
      "click",
      () => selectDate(date)
    );

    dateCards.appendChild(button);

  }

}


/* =========================================================
   DATE LABELS
========================================================= */

function updateDateLabels() {

  const longDate =
    formatDateLong(selectedDate);

  const shortDate =
    formatDateShort(selectedDate);

  selectedDateTitle.textContent =
    longDate.charAt(0).toUpperCase() +
    longDate.slice(1);

  selectedDateSubtitle.textContent =
    "Zgjidhni një orar për të planifikuar vizitën.";

  formDateLabel.textContent =
    shortDate;

  agendaDateText.textContent =
    longDate.charAt(0).toUpperCase() +
    longDate.slice(1);

}


/* =========================================================
   TIME OPTIONS
========================================================= */

function generateTimeOptions() {

  appointmentTime.innerHTML = "";

  for (
    let minutes = TIME_START_HOUR * 60;
    minutes <= TIME_END_HOUR * 60;
    minutes += TIME_INTERVAL
  ) {

    const hour =
      Math.floor(minutes / 60);

    const minute =
      minutes % 60;

    const value =
      pad(hour) + ":" + pad(minute);

    const option =
      document.createElement("option");

    option.value = value + ":00";

    option.textContent = value;

    appointmentTime.appendChild(option);

  }

}


/* =========================================================
   VISIT / PAYMENT
========================================================= */

function updatePaymentVisibility() {

  if (visitControl.checked) {

    paymentBox.classList.add("visible");

  } else {

    paymentBox.classList.remove("visible");

    paymentYes.checked = false;
    paymentNo.checked = false;

  }

}


visitNew.addEventListener(
  "change",
  updatePaymentVisibility
);

visitControl.addEventListener(
  "change",
  updatePaymentVisibility
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

  formMessage.textContent = text;

  formMessage.className =
    "message " + type;

}


function clearMessage() {

  formMessage.textContent = "";

  formMessage.className =
    "message";

}


/* =========================================================
   LOAD APPOINTMENTS
========================================================= */

async function loadAppointments() {

  agenda.innerHTML = `
    <div class="loading">
      Po ngarkohet agjenda...
    </div>
  `;

  const dateString =
    formatDateSQL(selectedDate);

  try {

    const data =
      await supabaseRequest(
        "appointments?select=*&appointment_date=eq." +
        encodeURIComponent(dateString) +
        "&order=appointment_time.asc",
        {
          method: "GET"
        }
      );

    appointments =
      Array.isArray(data) ? data : [];

    renderAgenda();

  } catch (error) {

    console.error(error);

    agenda.innerHTML = `
      <div class="no-data">
        Nuk u arrit të ngarkohet agjenda.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    appointmentCount.textContent = "0";

  }

}


/* =========================================================
   RENDER AGENDA
========================================================= */

function renderAgenda() {

  agenda.innerHTML = "";

  appointmentCount.textContent =
    appointments.length;


  for (
    let minutes = TIME_START_HOUR * 60;
    minutes <= TIME_END_HOUR * 60;
    minutes += TIME_INTERVAL
  ) {

    const hour =
      Math.floor(minutes / 60);

    const minute =
      minutes % 60;

    const time =
      pad(hour) + ":" + pad(minute);

    const timeWithSeconds =
      time + ":00";

    const appointment =
      appointments.find(item => {

        return normalizeTime(
          item.appointment_time
        ) === time;

      });


    const row =
      document.createElement("div");

    row.className =
      "appointment-row";


    const timeCell =
      document.createElement("div");

    timeCell.className =
      "time-cell";

    timeCell.textContent =
      time;


    const appointmentCell =
      document.createElement("div");

    appointmentCell.className =
      "appointment-cell";


    if (appointment) {

      appointmentCell.innerHTML =
        createAppointmentHTML(
          appointment
        );

    } else {

      appointmentCell.innerHTML = `
        <div class="empty-slot">
          Orar i lirë
        </div>
      `;

    }


    row.appendChild(timeCell);

    row.appendChild(appointmentCell);

    agenda.appendChild(row);

  }

}


/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(value) {

  if (!value) {
    return "";
  }

  return String(value)
    .substring(0, 5);

}


/* =========================================================
   APPOINTMENT HTML
========================================================= */

function createAppointmentHTML(item) {

  const name =
    escapeHtml(
      item.patient_name || ""
    );

  const visitType =
    escapeHtml(
      item.visit_type || ""
    );

  const card =
    escapeHtml(
      item.card_number || ""
    );

  const payment =
    item.payment_status || "";


  let paymentHTML = "";

  if (
    visitType === "Rikontroll" &&
    payment
  ) {

    if (payment === "Me pagesë") {

      paymentHTML = `
        <span class="tag payment">
          Me pagesë
        </span>
      `;

    } else if (payment === "Pa pagesë") {

      paymentHTML = `
        <span class="tag no-payment">
          Pa pagesë
        </span>
      `;

    } else {

      paymentHTML = `
        <span class="tag payment">
          ${escapeHtml(payment)}
        </span>
      `;

    }

  }


  let cardHTML = "";

  if (card) {

    cardHTML = `
      <span class="card-number">
        Kartelë: ${card}
      </span>
    `;

  }


  return `
    <div class="appointment">

      <div class="appointment-info">

        <div class="appointment-name">
          ${name}
        </div>

        <div class="appointment-meta">

          <span class="tag visit">
            ${visitType}
          </span>

          ${paymentHTML}

          ${cardHTML}

        </div>

      </div>

      <button
        type="button"
        class="delete-button"
        onclick="deleteAppointment(${Number(item.id)})"
        title="Fshi vizitën">

        ×

      </button>

    </div>
  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   SAVE APPOINTMENT
========================================================= */

appointmentForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearMessage();


    const name =
      patientName.value.trim();

    const card =
      cardNumber.value.trim();

    const time =
      appointmentTime.value;

    const visitType =
      document.querySelector(
        'input[name="visitType"]:checked'
      )?.value || "Vizitë";

    let paymentStatus =
      null;


    if (!name) {

      showMessage(
        "Ju lutem vendosni emrin dhe mbiemrin.",
        "error"
      );

      return;

    }


    if (!time) {

      showMessage(
        "Ju lutem zgjidhni orarin.",
        "error"
      );

      return;

    }


    if (
      visitType === "Rikontroll"
    ) {

      const selectedPayment =
        document.querySelector(
          'input[name="paymentStatus"]:checked'
        );

      if (!selectedPayment) {

        showMessage(
          "Për Rikontroll duhet të zgjidhni Me pagesë ose Pa pagesë.",
          "error"
        );

        return;

      }

      paymentStatus =
        selectedPayment.value;

    }


    /*
      Kontrollo nëse orari është i zënë.
    */

    const existing =
      appointments.find(item => {

        return normalizeTime(
          item.appointment_time
        ) === normalizeTime(time);

      });


    if (existing) {

      showMessage(
        "Ky orar është tashmë i zënë.",
        "error"
      );

      return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
      "Po ruhet...";


    const payload = {

      appointment_date:
        formatDateSQL(selectedDate),

      appointment_time:
        time,

      patient_name:
        name,

      card_number:
        card || null,

      visit_type:
        visitType,

      payment_status:
        paymentStatus

    };


    try {

      await supabaseRequest(
        "appointments",
        {
          method: "POST",
          body: JSON.stringify(payload)
        }
      );


      showMessage(
        "Vizita u ruajt me sukses.",
        "success"
      );


      appointmentForm.reset();

      visitNew.checked = true;

      updatePaymentVisibility();

      generateTimeOptions();

      await loadAppointments();


    } catch (error) {

      console.error(error);

      showMessage(
        "Vizita nuk u ruajt: " +
        error.message,
        "error"
      );

    }


    saveButton.disabled = false;

    saveButton.textContent =
      "Ruaj vizitën";

  }
);


/* =========================================================
   DELETE APPOINTMENT
========================================================= */

async function deleteAppointment(id) {

  const confirmed =
    window.confirm(
      "Jeni të sigurt që dëshironi ta fshini këtë vizitë?"
    );

  if (!confirmed) {
    return;
  }


  try {

    await supabaseRequest(
      "appointments?id=eq." +
      encodeURIComponent(id),
      {
        method: "DELETE"
      }
    );


    await loadAppointments();


  } catch (error) {

    console.error(error);

    alert(
      "Vizita nuk u fshi: " +
      error.message
    );

  }

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

  generateTimeOptions();

  renderDateCards();

  updateDateLabels();

  updatePaymentVisibility();

  loadAppointments();

}


initialize();

</script>
