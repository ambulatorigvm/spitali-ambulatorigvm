<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPITALI GVM — AMBULATORI GVM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
  --navy:#073f63;--blue:#087fa8;--cyan:#13a6c7;--teal:#0d8fae;
  --ink:#173f59;--muted:#6d8492;--line:#d8e6ed;--white:#fff;
}
html,body{min-height:100%}
body{
  margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);
  background:#dbeaf1 url("hospital-bg.png") center top/cover fixed no-repeat;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(238,247,251,.95) 0%,rgba(238,247,251,.82) 35%,rgba(221,239,247,.60) 100%);
}
.app-shell{min-height:100vh;display:flex}
.sidebar{
  width:230px;flex:0 0 230px;background:rgba(247,252,255,.94);
  border-right:1px solid rgba(181,207,220,.8);padding:22px 14px;
  display:flex;flex-direction:column;box-shadow:4px 0 18px rgba(7,63,99,.08)
}
.brand-mini{padding:4px 12px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand-mini strong{display:block;color:var(--navy);font-size:18px;letter-spacing:.3px}
.brand-mini span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.nav-item{
  display:flex;align-items:center;gap:13px;padding:13px 14px;margin:3px 0;
  border-radius:9px;color:#174e6c;font-weight:700;font-size:14px
}
.nav-item{width:100%;border:0;background:transparent;text-align:left;font-family:inherit;cursor:pointer}.nav-item:hover{background:#edf6fa}.nav-item.disabled{opacity:.52;cursor:default}.nav-item.disabled:hover{background:transparent}.nav-icon{width:22px;text-align:center;font-size:18px}
.nav-item.active{background:#dceff7;color:#087aa1;border-left:3px solid var(--cyan)}
.nav-icon{width:24px;text-align:center;font-size:18px}
.sidebar-footer{margin-top:auto;padding:14px 12px;color:#78909e;font-size:11px;line-height:1.6}
.main{flex:1;min-width:0;padding:20px 26px 42px}
.topbar{
  max-width:1200px;margin:0 auto 18px;background:rgba(255,255,255,.94);
  border:1px solid rgba(205,224,233,.9);border-radius:12px;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 5px 18px rgba(7,63,99,.07)
}
.hospital-logo{display:flex;align-items:center;gap:13px}
.logo-mark{
  width:48px;height:48px;border-radius:11px;background:linear-gradient(135deg,#0b8aaa,#08738f);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800
}
.logo-names{display:flex;align-items:center;gap:20px}
.hospital-name,.ambulatory-name{font-weight:850;color:var(--navy);letter-spacing:.3px;line-height:1}
.hospital-name{font-size:24px}.ambulatory-name{font-size:24px}
.logo-divider{width:1px;height:27px;background:#b8ccd6}
.top-date{font-size:14px;color:#486979;font-weight:650}
.content{max-width:1200px;margin:0 auto}
.page-heading{display:flex;align-items:end;justify-content:space-between;margin:12px 2px 14px}
.page-heading h1{margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,45,75,.28);font-size:25px}
.page-heading .date-title{margin:0;color:#eef9fd;font-size:13px;font-weight:650;text-shadow:0 1px 6px #315e70}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{
 background:rgba(255,255,255,.94);border:1px solid rgba(208,225,233,.95);border-radius:12px;
 padding:15px 16px;box-shadow:0 5px 16px rgba(7,63,99,.07);display:flex;align-items:center;gap:13px
}
.stat-icon{width:42px;height:42px;border-radius:10px;background:#e3f3f8;color:#0781a7;display:flex;align-items:center;justify-content:center;font-size:20px}
.stat-label{font-size:12px;color:#6b8290;font-weight:700}.stat-value{font-size:23px;font-weight:850;color:var(--navy);margin-top:2px}
.workspace{display:grid;grid-template-columns:minmax(310px,.82fr) minmax(500px,1.35fr);gap:14px}
.card{
 background:rgba(255,255,255,.95);padding:22px;border:1px solid rgba(207,225,233,.95);
 border-radius:13px;box-shadow:0 7px 20px rgba(7,63,99,.08);margin:0
}
.card-title{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--navy);font-size:18px;font-weight:850}
.card-title .title-icon{color:var(--cyan)}
label{display:block;font-weight:700;font-size:13px;color:#365b6e;margin-bottom:6px}
input,select{
 width:100%;height:44px;margin-bottom:14px;padding:9px 12px;border:1px solid #c9dbe4;
 border-radius:8px;font-size:15px;background:#fff;color:#173f59
}
input:focus,select:focus{outline:none;border-color:#13a6c7;box-shadow:0 0 0 3px rgba(19,166,199,.12)}
button{
 width:100%;height:44px;border:0;border-radius:8px;background:linear-gradient(135deg,#0b8aaa,#08738f);
 color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 9px rgba(8,115,143,.2)
}
button:hover{filter:brightness(.96)}
#paymentBox{display:none;margin-bottom:14px;padding:12px 13px;background:#f4fafc;border:1px solid var(--line);border-radius:8px}
.payment-option{display:flex;align-items:center;gap:8px;margin:7px 0;font-weight:600;font-size:13px}
.payment-option input{width:16px;height:16px;margin:0;accent-color:var(--cyan)}
#message{display:none;margin-bottom:12px;padding:10px 13px;border-radius:8px;text-align:center;font-weight:700;font-size:13px}
.message-success{display:block!important;background:#eaf8f0;color:#17663e;border:1px solid #b9dfc7}
.message-error{display:block!important;background:#fff1f1;color:#9e3030;border:1px solid #e6bcbc}
.agenda-card{min-height:520px}
.agenda-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.agenda-head h2{margin:0;color:var(--navy);font-size:18px}
.agenda-date{font-size:12px;color:#67818f;font-weight:700}
#visits{display:flex;flex-direction:column;gap:7px}
.agenda-slot{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:stretch;min-height:58px}
.slot-time{display:flex;align-items:center;justify-content:center;color:#557381;font-size:13px;font-weight:850;background:#f1f7f9;border:1px solid #dce8ed;border-radius:8px}
.slot-body{display:flex;align-items:center;min-width:0;border:1px solid #e0ebf0;border-radius:8px;background:#fbfdfe;padding:9px 11px}
.slot-empty{color:#9aaeb8;font-size:12px}
.slot-visit{display:grid;grid-template-columns:minmax(130px,1.1fr) 130px 170px 90px;gap:10px;align-items:center;width:100%;border-left:4px solid #16a5c4}
.slot-visit.control{border-left-color:#726bd8}
.visit-name{font-weight:800;color:#244f66;font-size:14px}
.visit-line{font-size:11px;color:#78909e;margin-top:3px}
.statusLine{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.visit-type,.payment-paid,.payment-free{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
.visit-type{background:#e4f3fa;color:#087aa1}
.payment-paid{background:#fff1d7;color:#996000}
.payment-free{background:#dff6eb;color:#17734b}
.delete-button{height:32px;font-size:11px;background:#f4f7f8;color:#8c4b4b;box-shadow:none;border:1px solid #e2e8eb}
.delete-button:hover{background:#fdecec}
.empty,.loading{padding:28px;text-align:center;background:#f8fbfc;border:1px dashed #cbdde5;border-radius:9px;color:#748d9a;font-size:13px}
@media(max-width:1050px){
 .sidebar{width:190px;flex-basis:190px}.workspace{grid-template-columns:1fr}.agenda-slot{grid-template-columns:58px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
 .app-shell{display:block}.sidebar{width:100%;display:block;padding:10px 12px}.brand-mini{display:none}
 .sidebar-footer{display:none}.nav-item{display:inline-flex;margin:2px;font-size:12px;padding:9px}
 .main{padding:10px 12px 30px}.topbar{padding:12px;display:block}
 .logo-names{gap:8px;flex-wrap:wrap}.hospital-name,.ambulatory-name{font-size:18px}.logo-divider{display:none}
 .top-date{margin-top:8px}.stats{grid-template-columns:1fr 1fr}.visit-item{grid-template-columns:55px 1fr 1fr}
 .visit-line{display:none}.slot-visit{grid-template-columns:1fr auto}.slot-visit .statusLine{grid-column:1}.slot-visit > div:last-child{grid-column:2}.delete-button{grid-column:auto}
}
@media(max-width:480px){
 .stats{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.agenda-slot{grid-template-columns:58px minmax(0,1fr)}
 .hospital-logo{align-items:flex-start}.logo-mark{width:42px;height:42px;font-size:24px}
}
</style>

<style id="step5-date-nav">
.date-navigation{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:0 0 18px;
    padding:12px;
    background:#f5f9fb;
    border:1px solid #d8e4e9;
    border-radius:10px;
}
.date-navigation button{
    width:auto;
    min-width:110px;
    height:40px;
    padding:0 15px;
    font-size:13px;
    box-shadow:none;
}
.date-navigation .today-button{
    background:#fff;
    color:#176b8c;
    border:1px solid #bcd1da;
}
.date-navigation .today-button:hover{
    background:#edf7f9;
}
.selected-date{
    text-align:center;
    flex:1;
}
.selected-date .date-main{
    display:block;
    color:#123b52;
    font-size:17px;
    font-weight:800;
    text-transform:capitalize;
}
.selected-date .date-iso{
    display:block;
    color:#7a8d97;
    font-size:11px;
    margin-top:3px;
}
@media(max-width:620px){
    .date-navigation{gap:7px;padding:9px}
    .date-navigation button{min-width:0;padding:0 9px}
    .selected-date .date-main{font-size:14px}
}
</style>



<style id="agenda-search-style">
.agenda-search{display:flex;align-items:center;gap:8px;margin:0 0 9px;background:rgba(7,27,42,.92);border:1px solid rgba(122,184,211,.22);border-radius:10px;padding:0 10px}
.agenda-search-icon{color:#6ed8e8;font-size:20px;line-height:1}
.agenda-search input{flex:1!important;margin:0!important;height:42px!important;border:0!important;background:transparent!important;box-shadow:none!important;padding:8px 4px!important}
.agenda-search input:focus{box-shadow:none!important;border:0!important}
.agenda-search button{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid rgba(122,184,211,.2);background:rgba(255,255,255,.05);color:#9fb8c6;font-size:20px;line-height:1;cursor:pointer}
.agenda-search button:hover{background:rgba(24,185,210,.12);color:#fff}
.agenda-search-info{min-height:18px;margin:0 2px 5px;color:#7397a9;font-size:11px}
</style>
<style id="step6-status">
.visit-item{
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid #d8e4e9 !important;
}
.visit-item.status-arrived{
    background:#c9f2d2 !important;
    border-color:#72c982 !important;
}
.visit-item.status-finished{
    background:#fff0a8 !important;
    border-color:#e1c34d !important;
}
.visit-item.status-cancelled{
    background:#d9dee1 !important;
    border-color:#aab3b8 !important;
    opacity:.9;
}
.visit-status-controls{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}
.visit-status-button,.visit-delete-button{
    border:1px solid #ccd9df;
    background:rgba(255,255,255,.9);
    color:#244554;
    border-radius:7px;
    padding:7px 10px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}
.visit-status-button.active{
    box-shadow:0 0 0 2px rgba(22,106,139,.12);
}
.visit-status-button.arrived.active{
    border-color:#28a745;
    background:#eaf8ed;
    color:#18752f;
}
.visit-status-button.finished.active{
    border-color:#e2b400;
    background:#fff6d8;
    color:#806500;
}
.visit-status-button.cancelled.active{
    border-color:#8a959d;
    background:#e9edef;
    color:#4f5b62;
}
.visit-delete-button{
    margin-left:auto;
    border-color:#e2b8b8;
    color:#a53a3a;
}
.status-badge{
    display:inline-block;
    margin-left:7px;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}
.status-badge.arrived{background:#b2e8bd;color:#146b2b}
.status-badge.finished{background:#ffe27a;color:#735d00}
.status-badge.cancelled{background:#c3cbd0;color:#465158}
</style>

.status-badge.cancelled{background:rgba(184,198,207,.14)!important;color:#c9d4da!important}
.status-badge{color:#a9c2cf}

.visit-status-controls{justify-content:flex-end!important;margin-top:0!important}
.visit-status-button,.visit-delete-button{
  background:rgba(4,17,28,.42)!important;
  color:#c7dce5!important;
  border:1px solid rgba(137,194,216,.20)!important;
}
.visit-status-button.arrived.active{background:rgba(45,190,120,.20)!important;color:#8af0ba!important;border-color:rgba(83,220,154,.38)!important}
.visit-status-button.finished.active{background:rgba(230,193,49,.18)!important;color:#ffe685!important;border-color:rgba(238,206,84,.38)!important}
.visit-status-button.cancelled.active{background:rgba(180,193,201,.16)!important;color:#d0d9de!important;border-color:rgba(174,190,200,.28)!important}
.visit-delete-button{color:#ff9ca4!important;border-color:rgba(225,95,105,.25)!important}

.empty,.loading{
  background:rgba(6,22,34,.72)!important;
  border:1px dashed rgba(125,180,201,.22)!important;
  color:#7698a9!important;
}

#saveButton{
  background:linear-gradient(135deg,#1599cf,#0b6faf)!important;
  border:1px solid rgba(120,220,240,.20)!important;
  box-shadow:0 8px 20px rgba(7,111,175,.22)!important;
}
#saveButton:hover{filter:brightness(1.08)}

@media(max-width:1050px){
  .workspace{grid-template-columns:1fr!important}
  .workspace .agenda-card{order:1}
  .workspace>.card:not(.agenda-card){order:2}
  .visit-item{grid-template-columns:60px 1fr 1fr!important}
  .visit-status-controls{grid-column:1/-1;justify-content:flex-start!important}
}
@media(max-width:760px){
  .sidebar{background:rgba(4,20,34,.98)!important}
  .main{padding:10px 12px 30px!important}
  .topbar{min-height:92px!important;padding:14px!important}
  .visit-item{grid-template-columns:58px 1fr 1fr!important}
  .visit-status-controls{grid-column:1/-1}
}
@media(max-width:480px){
  .visit-item{grid-template-columns:55px 1fr!important}
  .visit-time{grid-row:1/2}
  .visit-status-controls{grid-column:1/-1}
}
</style>

</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-mini">
      <strong>SPITALI GVM</strong>
      <span>AMBULATORI GVM</span>
    </div>
    <button class="nav-item active" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
    <button class="nav-item" type="button" onclick="document.querySelector('.agenda-card').scrollIntoView({behavior:'smooth',block:'start'})"><span class="nav-icon">▣</span><span>Agjenda</span></button>
    <button class="nav-item" type="button" onclick="document.querySelector('#visits').scrollIntoView({behavior:'smooth',block:'start'})"><span class="nav-icon">♙</span><span>Vizitat</span></button>
    <button class="nav-item disabled" type="button" title="Modul që do të shtohet më vonë"><span class="nav-icon">⌕</span><span>Kërko</span></button>
    <button class="nav-item disabled" type="button" title="Modul që do të shtohet më vonë"><span class="nav-icon">▥</span><span>Raporte</span></button>
    <button class="nav-item disabled" type="button" title="Modul që do të shtohet më vonë"><span class="nav-icon">⚙</span><span>Cilësimet</span></button>
    <div class="sidebar-footer">
      SPITALI GVM<br>AMBULATORI GVM<br>Sistemi i Menaxhimit të Vizitave
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="hospital-logo">
        <div class="logo-mark">✚</div>
        <div class="logo-names">
          <div class="hospital-name">SPITALI GVM</div>
          <div class="logo-divider"></div>
          <div class="ambulatory-name">AMBULATORI GVM</div>
        </div>
      </div>
      <div class="top-date" id="topDate"></div>
    </header>

    <div class="content">
      <div class="page-heading">
        <h1>Paneli i Ambulatorit</h1>
        
<div class="date-navigation">
    <button type="button" id="prevDate">← Dita e mëparshme</button>
    <button type="button" class="today-button" id="todayButton">Sot</button>
    <div class="selected-date">
        <span class="date-main" id="selectedDateLabel"></span>
        <span class="date-iso" id="selectedDateIso"></span>
    </div>
    <button type="button" id="nextDate">Dita tjetër →</button>
</div>

    <div id="todayDate" class="date-title"></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-icon">▣</div><div><div class="stat-label">Vizita sot</div><div class="stat-value" id="statTotal">0</div></div></div>
        <div class="stat"><div class="stat-icon">♙</div><div><div class="stat-label">Vizita</div><div class="stat-value" id="statVisits">0</div></div></div>
        <div class="stat"><div class="stat-icon">↻</div><div><div class="stat-label">Rikontrolle</div><div class="stat-value" id="statControls">0</div></div></div>
        <div class="stat"><div class="stat-icon">€</div><div><div class="stat-label">Me pagesë</div><div class="stat-value" id="statPaid">0</div></div></div>
      </div>

      <div id="message"></div>

      <div class="workspace">
        <section class="card">
          <div class="card-title"><span class="title-icon">＋</span> Shto Vizitë të Re</div>

          <label for="patientName">Emër + Mbiemër *</label>
          <input type="text" id="patientName" placeholder="Shkruani emrin dhe mbiemrin" autocomplete="off">

          <label for="visitType">Lloji i vizitës *</label>
          <select id="visitType">
            <option value="Vizitë">Vizitë</option>
            <option value="Rikontroll">Rikontroll</option>
          </select>

          <div id="paymentBox">
            <label>Pagesa (vetëm për Rikontroll)</label>
            <label class="payment-option"><input type="radio" name="payment" value="Me pagesë"><span>Me pagesë</span></label>
            <label class="payment-option"><input type="radio" name="payment" value="Pa pagesë"><span>Pa pagesë</span></label>
          </div>

          <label for="cardNumber">Nr. kartelës <span style="font-weight:500;color:#8aa0aa">(opsionale)</span></label>
          <input type="text" id="cardNumber" placeholder="Shkruani nr. e kartelës" autocomplete="off">

          <label for="appointmentTime">Orari *</label>
          <select id="appointmentTime"><option value="">Zgjidh orën</option></select>

          <button id="saveButton" type="button">＋ &nbsp; Ruaj Vizitën</button>
        </section>

        <section class="card agenda-card">
          <div class="agenda-head">
            <h2>▣ &nbsp; Agjenda e Ditës</h2>
            <div class="agenda-date">12:00 — 17:00</div>
          </div>
          <div class="agenda-search">
            <span class="agenda-search-icon">⌕</span>
            <input id="agendaSearch" type="search" placeholder="Kërko pacientin ose nr. e kartelës..." autocomplete="off">
            <button id="clearAgendaSearch" type="button" title="Pastro kërkimin">×</button>
          </div>
          <div id="agendaSearchInfo" class="agenda-search-info"></div>
          <div id="visits">
            <div class="loading">Po ngarkohen vizitat...</div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

console.log("AMBULATORI GVM: Supabase client u inicializua");


/* =========================================================
   ELEMENTET
========================================================= */

const patientName =
    document.getElementById("patientName");

const cardNumber =
    document.getElementById("cardNumber");

const visitType =
    document.getElementById("visitType");

const paymentBox =
    document.getElementById("paymentBox");

const appointmentTime =
    document.getElementById("appointmentTime");

const saveButton =
    document.getElementById("saveButton");

const visits =
    document.getElementById("visits");

const message =
    document.getElementById("message");

const todayDate =
    document.getElementById("todayDate");


/* =========================================================
   DATA E SOTME
========================================================= */

let selectedDate = new Date();
let agendaSearchText = "";

function formatDateISO(date){
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2,"0");
    const day = String(date.getDate()).padStart(2,"0");
    return year + "-" + month + "-" + day;
}

function isToday(date){
    const now = new Date();
    return formatDateISO(date) === formatDateISO(now);
}


/* =========================================================
   SHFAQ DATEN
========================================================= */

function showSelectedDate(){
    const formatted = selectedDate.toLocaleDateString(
        "sq-AL",
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

    todayDate.textContent = formatted;

    const label = document.getElementById("selectedDateLabel");
    const iso = document.getElementById("selectedDateIso");

    if(label){
        label.textContent = formatted;
    }

    if(iso){
        iso.textContent = formatDateISO(selectedDate);
    }
}


/* =========================================================
   KRIJO ORARET
========================================================= */

function createTimeOptions(){

    appointmentTime.innerHTML =
        '<option value="">Zgjidh orën</option>';

    for(
        let hour = 12;
        hour <= 17;
        hour++
    ){

        for(
            let minute = 0;
            minute < 60;
            minute += 15
        ){

            if(
                hour === 17 &&
                minute > 0
            ){
                continue;
            }

            const time =
                String(hour).padStart(2,"0")
                +
                ":"
                +
                String(minute).padStart(2,"0");

            const option =
                document.createElement("option");

            option.value =
                time;

            option.textContent =
                time;

            appointmentTime.appendChild(
                option
            );
        }
    }

}


/* =========================================================
   SHOW / HIDE PAGESEN
========================================================= */

visitType.addEventListener(
    "change",
    function(){

        if(
            visitType.value ===
            "Rikontroll"
        ){

            paymentBox.style.display =
                "block";

        }
        else{

            paymentBox.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="payment"]'
                )
                .forEach(
                    function(radio){
                        radio.checked =
                            false;
                    }
                );
        }

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "";

    if(type === "success"){

        message.classList.add(
            "message-success"
        );

    }
    else{

        message.classList.add(
            "message-error"
        );

    }

    setTimeout(
        function(){

            message.style.display =
                "none";

            message.className =
                "";

        },
        5000
    );

}


/* =========================================================
   RUAJ VIZITEN
========================================================= */

async function saveVisit(){

    const name =
        patientName.value.trim();

    const card =
        cardNumber.value.trim();

    const type =
        visitType.value;

    const time =
        appointmentTime.value;

    let payment =
        null;


    /* VALIDIM */

    if(!name){

        showMessage(
            "Vendos Emër Mbiemër.",
            "error"
        );

        patientName.focus();

        return;
    }


    if(!time){

        showMessage(
            "Zgjidh orën e vizitës.",
            "error"
        );

        appointmentTime.focus();

        return;
    }


    /* PAGESA VETEM PER RIKONTROLL */

    if(type === "Rikontroll"){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );

        if(!selectedPayment){

            showMessage(
                "Zgjidh Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }

        payment =
            selectedPayment.value;

    }


    const date =
        formatDateISO(selectedDate);


    /* DISABLE BUTTON */

    saveButton.disabled =
        true;

    saveButton.textContent =
        "Po ruhet...";


    console.log(
        "Po ruhet vizita:",
        {
            appointment_date:date,
            appointment_time:time,
            patient_name:name,
            card_number:card || null,
            visit_type:type,
            payment_status:payment
        }
    );


    /* INSERT SUPABASE */

    let result;

    try {
        result = await db
            .from("appointments")
            .insert({
                appointment_date: date,
                appointment_time: time,
                patient_name: name,
                card_number: card || null,
                visit_type: type,
                payment_status: payment,
                status: "scheduled"
            });
    } catch (err) {
        console.error("SUPABASE INSERT EXCEPTION:", err);
        showMessage(
            "Gabim gjatë ruajtjes: " + (err.message || err),
            "error"
        );
        saveButton.disabled = false;
        saveButton.textContent = "Ruaj Vizitën";
        return;
    }

    console.log("Supabase result:", result);


    /* GABIM */

    if(result.error){

        console.error(
            "SUPABASE INSERT ERROR:",
            result.error
        );

        showMessage(
            "Gabim Supabase: " +
            result.error.message,
            "error"
        );

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Ruaj Vizitën";

        return;
    }


    /* SUKSES */

    showMessage(
        "Vizita u ruajt me sukses.",
        "success"
    );


    /* PASTRO FORMULAREN */

    patientName.value =
        "";

    cardNumber.value =
        "";

    appointmentTime.value =
        "";

    visitType.value =
        "Vizitë";

    paymentBox.style.display =
        "none";


    document
        .querySelectorAll(
            'input[name="payment"]'
        )
        .forEach(
            function(radio){

                radio.checked =
                    false;

            }
        );


    saveButton.disabled =
        false;

    saveButton.textContent =
        "Ruaj Vizitën";


    /* RINGARKO LISTEN */

    await loadVisits();

}


/* =========================================================
   NGARKO VIZITAT E SOTME
========================================================= */

async function loadVisits(){

    visits.innerHTML =
        '<div class="loading">Po ngarkohen vizitat...</div>';

    const date =
        formatDateISO(selectedDate);

    const result =
        await db
            .from("appointments")
            .select(
                "id, appointment_date, appointment_time, patient_name, card_number, visit_type, payment_status, status"
            )
            .eq(
                "appointment_date",
                date
            )
            .order(
                "appointment_time",
                {
                    ascending:true
                }
            );

    if(result.error){

        console.error(
            "SUPABASE SELECT ERROR:",
            result.error
        );

        visits.innerHTML =
            "<div class=\"empty\"><strong>Gabim gjatë ngarkimit</strong><br><br>" +
            result.error.message +
            "</div>";

        return;
    }

    const data =
        result.data || [];

    if(data.length === 0){

        visits.innerHTML =
            '<div class="empty">Nuk ka vizita të regjistruara për këtë datë.</div>';

        return;
    }

    visits.innerHTML = "";

    data.forEach(function(visit){

        const item =
            document.createElement("div");

        item.className =
            "visit-item";
        item.dataset.searchText = (
            (visit.patient_name || "") + " " +
            (visit.card_number || "")
        ).toLowerCase();

        const currentStatus =
            visit.status || "scheduled";

        let statusLabel = "Në pritje";
        let statusClass = "";

        if(currentStatus === "arrived"){
            statusLabel = "Ka ardhur";
            statusClass = "arrived";
        }
        else if(currentStatus === "finished"){
            statusLabel = "Ka mbaruar";
            statusClass = "finished";
        }
        else if(currentStatus === "cancelled"){
            statusLabel = "Anulluar";
            statusClass = "cancelled";
        }

        if(statusClass){
            item.classList.add(
                "status-" + statusClass
            );
        }

        const time =
            document.createElement("div");

        time.className =
            "visit-time";

        time.textContent =
            visit.appointment_time
                ? String(visit.appointment_time).substring(0,5)
                : "--:--";

        const name =
            document.createElement("div");

        name.className =
            "visit-name";

        name.textContent =
            visit.patient_name || "";

        const card =
            document.createElement("div");

        card.className =
            "visit-line";

        card.innerHTML =
            "<strong>Nr. Kartelës:</strong> " +
            (visit.card_number || "—");

        const statusLine =
            document.createElement("div");

        const type =
            document.createElement("span");

        type.className =
            "visit-type";

        type.textContent =
            visit.visit_type || "Vizitë";

        statusLine.appendChild(type);

        if(visit.visit_type === "Rikontroll"){

            const payment =
                document.createElement("span");

            if(visit.payment_status === "Me pagesë"){
                payment.className = "payment-paid";
                payment.textContent = "Me pagesë";
            }
            else if(visit.payment_status === "Pa pagesë"){
                payment.className = "payment-free";
                payment.textContent = "Pa pagesë";
            }
            else{
                payment.className = "payment-paid";
                payment.textContent = "Pagesa nuk është zgjedhur";
            }

            statusLine.appendChild(payment);
        }

        const badge =
            document.createElement("span");

        badge.className =
            "status-badge " + statusClass;

        badge.textContent =
            statusLabel;

        statusLine.appendChild(badge);

        const controls =
            document.createElement("div");

        controls.className =
            "visit-status-controls";

        const arrived =
            document.createElement("button");

        arrived.type = "button";
        arrived.className =
            "visit-status-button arrived" +
            (currentStatus === "arrived" ? " active" : "");
        arrived.textContent =
            "✓ Ka ardhur";

        arrived.addEventListener("click", function(){
            updateVisitStatus(
                visit.id,
                "arrived"
            );
        });

        const finished =
            document.createElement("button");

        finished.type = "button";
        finished.className =
            "visit-status-button finished" +
            (currentStatus === "finished" ? " active" : "");
        finished.textContent =
            "✓ Ka mbaruar";

        finished.addEventListener("click", function(){
            updateVisitStatus(
                visit.id,
                "finished"
            );
        });

        const cancelled =
            document.createElement("button");

        cancelled.type = "button";
        cancelled.className =
            "visit-status-button cancelled" +
            (currentStatus === "cancelled" ? " active" : "");
        cancelled.textContent =
            "Anullo";

        cancelled.addEventListener("click", function(){
            updateVisitStatus(
                visit.id,
                "cancelled"
            );
        });

        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className =
            "visit-delete-button";
        deleteButton.textContent =
            "Fshi vizitën";

        deleteButton.addEventListener("click", function(){
            deleteVisit(visit.id);
        });

        controls.appendChild(arrived);
        controls.appendChild(finished);
        controls.appendChild(cancelled);
        controls.appendChild(deleteButton);

        item.appendChild(time);
        item.appendChild(name);
        item.appendChild(card);
        item.appendChild(statusLine);
        item.appendChild(controls);

        visits.appendChild(item);
    });

    applyAgendaSearch();
}

function applyAgendaSearch(){
    const query = agendaSearchText.trim().toLowerCase();
    const items = Array.from(document.querySelectorAll("#visits .visit-item"));
    let visible = 0;

    items.forEach(function(item){
        const match = !query || (item.dataset.searchText || "").includes(query);
        item.style.display = match ? "grid" : "none";
        if(match) visible++;
    });

    const info = document.getElementById("agendaSearchInfo");
    if(!info) return;
    info.textContent = query ? (visible + " vizita u gjetën") : "";
}


/* =========================================================
   STATUSI DHE FSHIRJA
========================================================= */

async function updateVisitStatus(id, status){

    const result =
        await db
            .from("appointments")
            .update({
                status: status
            })
            .eq("id", id);

    if(result.error){

        showMessage(
            "Gabim gjatë ndryshimit të statusit: " +
            result.error.message,
            "error"
        );

        return;
    }

    await loadVisits();
}


async function deleteVisit(id){

    const confirmed =
        confirm(
            "A dëshiron ta fshish këtë vizitë? Ky veprim nuk mund të zhbëhet."
        );

    if(!confirmed){
        return;
    }

    const result =
        await db
            .from("appointments")
            .delete()
            .eq("id", id);

    if(result.error){

        showMessage(
            "Gabim gjatë fshirjes: " +
            result.error.message,
            "error"
        );

        return;
    }

    showMessage(
        "Vizita u fshi.",
        "success"
    );

    await loadVisits();
}


/* =========================================================
   NAVIGIMI I DATËS
========================================================= */

function changeDate(days){
    const next = new Date(selectedDate);
    next.setDate(next.getDate() + days);
    selectedDate = next;

    showSelectedDate();
    loadVisits();
}

document.getElementById("prevDate").addEventListener(
    "click",
    function(){
        changeDate(-1);
    }
);

document.getElementById("nextDate").addEventListener(
    "click",
    function(){
        changeDate(1);
    }
);

document.getElementById("todayButton").addEventListener(
    "click",
    function(){
        selectedDate = new Date();
        showSelectedDate();
        loadVisits();
    }
);


/* =========================================================
   KERKIMI I SHPEJTE
========================================================= */

const agendaSearch = document.getElementById("agendaSearch");
const clearAgendaSearch = document.getElementById("clearAgendaSearch");

if(agendaSearch){
    agendaSearch.addEventListener("input", function(){
        agendaSearchText = agendaSearch.value;
        applyAgendaSearch();
    });
}

if(clearAgendaSearch){
    clearAgendaSearch.addEventListener("click", function(){
        if(agendaSearch) agendaSearch.value = "";
        agendaSearchText = "";
        applyAgendaSearch();
        if(agendaSearch) agendaSearch.focus();
    });
}


/* =========================================================
   START
========================================================= */

showSelectedDate();

createTimeOptions();

loadVisits();

</script>
</body>
</html>
