<body>

<div class="container">

<h1>AMBULATORI GVM</h1>

<div class="card">

    <div id="message"></div>

    <label for="patientName">
        Emër Mbiemër
    </label>

    <input
        type="text"
        id="patientName"
        placeholder="Shkruaj emrin dhe mbiemrin"
        autocomplete="off"
    >

    <label for="cardNumber">
        Nr. Kartelës
    </label>

    <input
        type="text"
        id="cardNumber"
        placeholder="Shkruaj nr. e kartelës"
        autocomplete="off"
    >

    <label for="visitType">
        Lloji i vizitës
    </label>

    <select id="visitType">
        <option value="Vizitë">Vizitë</option>
        <option value="Rikontroll">Rikontroll</option>
    </select>

    <div id="paymentBox">

        <label>Pagesa</label>

        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="Me pagesë"
            >
            <span>Me pagesë</span>
        </label>

        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="Pa pagesë"
            >
            <span>Pa pagesë</span>
        </label>

    </div>

    <label for="appointmentTime">
        Zgjidh orën
    </label>

    <select id="appointmentTime">
        <option value="">Zgjidh orën</option>
    </select>

    <button onclick="saveVisit()">
        Ruaj Vizitën
    </button>

</div>


<div class="card">

    <div class="day-title">

        <div>
            <h2>Vizitat e ditës</h2>
            <div id="currentDate"></div>
        </div>

        <button
            class="refresh-button"
            onclick="loadVisits()"
        >
            Rifresko
        </button>

    </div>

    <div id="visits">
        <div class="empty">
            Po ngarkohen vizitat...
        </div>
    </div>

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTET
========================================= */

const visitType =
    document.getElementById("visitType");

const paymentBox =
    document.getElementById("paymentBox");

const appointmentTime =
    document.getElementById("appointmentTime");

const visitsContainer =
    document.getElementById("visits");

const message =
    document.getElementById("message");


/* =========================================
   DATA E SOTME
========================================= */

function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function displayToday(){

    const now = new Date();

    const day =
        String(now.getDate())
        .padStart(2,"0");

    const month =
        String(now.getMonth() + 1)
        .padStart(2,"0");

    const year =
        now.getFullYear();

    document.getElementById("currentDate").textContent =
        `${day}/${month}/${year}`;
}


/* =========================================
   ORARET
========================================= */

function createTimeOptions(){

    appointmentTime.innerHTML =
        '<option value="">Zgjidh orën</option>';

    for(let hour = 12; hour <= 17; hour++){

        for(let minute = 0; minute < 60; minute += 15){

            if(hour === 17 && minute > 0){
                continue;
            }

            const time =
                String(hour).padStart(2,"0")
                + ":"
                +
                String(minute).padStart(2,"0");

            const option =
                document.createElement("option");

            option.value = time;
            option.textContent = time;

            appointmentTime.appendChild(option);
        }
    }
}


/* =========================================
   RIKONTROLLI
========================================= */

visitType.addEventListener(
    "change",
    function(){

        if(this.value === "Rikontroll"){

            paymentBox.style.display =
                "block";

        }else{

            paymentBox.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="payment"]'
                )
                .forEach(
                    radio => radio.checked = false
                );
        }
    }
);


/* =========================================
   MESAZHET
========================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className = "";

    message.classList.add(type);

    setTimeout(
        function(){
            message.className = "";
            message.textContent = "";
        },
        4000
    );
}


/* =========================================
   RUAJ VIZITEN
========================================= */

async function saveVisit(){

    const patientName =
        document
            .getElementById("patientName")
            .value
            .trim();

    const cardNumber =
        document
            .getElementById("cardNumber")
            .value
            .trim();

    const visitTypeValue =
        visitType.value;

    const appointmentTimeValue =
        appointmentTime.value;

    let paymentStatus = null;


    if(!patientName){

        showMessage(
            "Vendos emrin e pacientit.",
            "error"
        );

        return;
    }


    if(!appointmentTimeValue){

        showMessage(
            "Zgjidh orën.",
            "error"
        );

        return;
    }


    if(visitTypeValue === "Rikontroll"){

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );

        if(!selectedPayment){

            showMessage(
                "Zgjidh Me pagesë ose Pa pagesë.",
                "error"
            );

            return;
        }

        paymentStatus =
            selectedPayment.value;
    }


    /* Kontrollojmë nëse ora është zënë */

    const today =
        getToday();


    const { data: existingVisit, error: checkError } =
        await supabaseClient
            .from("appointments")
            .select("id")
            .eq("appointment_date", today)
            .eq("appointment_time", appointmentTimeValue)
            .limit(1);


    if(checkError){

        console.error(checkError);

        showMessage(
            "Gabim gjatë kontrollit të orarit.",
            "error"
        );

        return;
    }


    if(existingVisit && existingVisit.length > 0){

        showMessage(
            "Kjo orë është tashmë e zënë.",
            "error"
        );

        return;
    }


    /* Ruajmë në Supabase */

    const { error } =
        await supabaseClient
            .from("appointments")
            .insert([
                {
                    appointment_date: today,
                    appointment_time:
                        appointmentTimeValue,
                    patient_name:
                        patientName,
                    card_number:
                        cardNumber || null,
                    visit_type:
                        visitTypeValue,
                    payment_status:
                        paymentStatus
                }
            ]);


    if(error){

        console.error(error);

        showMessage(
            "Vizita nuk u ruajt. Kontrollo Supabase.",
            "error"
        );

        return;
    }


    showMessage(
        "Vizita u ruajt me sukses.",
        "success"
    );


    /* Pastrojmë formularin */

    document
        .getElementById("patientName")
        .value = "";

    document
        .getElementById("cardNumber")
        .value = "";

    appointmentTime.value = "";

    visitType.value = "Vizitë";

    paymentBox.style.display =
        "none";

    document
        .querySelectorAll(
            'input[name="payment"]'
        )
        .forEach(
            radio => radio.checked = false
        );


    await loadVisits();
}


/* =========================================
   NGARKO VIZITAT
========================================= */

async function loadVisits(){

    visitsContainer.innerHTML =
        '<div class="empty">Po ngarkohen vizitat...</div>';


    const today =
        getToday();


    const { data, error } =
        await supabaseClient
            .from("appointments")
            .select("*")
            .eq("appointment_date", today)
            .order("appointment_time", {
                ascending:true
            });


    if(error){

        console.error(error);

        visitsContainer.innerHTML =
            '<div class="empty">Nuk u ngarkuan vizitat.</div>';

        return;
    }


    if(!data || data.length === 0){

        visitsContainer.innerHTML =
            '<div class="empty">Nuk ka vizita të regjistruara për sot.</div>';

        return;
    }


    visitsContainer.innerHTML = "";


    data.forEach(
        function(visit){

            const item =
                document.createElement("div");

            item.className =
                "visit-item";


            let paymentHTML = "";


            if(visit.visit_type === "Rikontroll"){

                if(visit.payment_status === "Me pagesë"){

                    paymentHTML =
                        '<span class="payment-paid">Me pagesë</span>';

                }else if(
                    visit.payment_status === "Pa pagesë"
                ){

                    paymentHTML =
                        '<span class="payment-free">Pa pagesë</span>';
                }
            }


            const time =
                String(visit.appointment_time)
                    .substring(0,5);


            item.innerHTML = `

                <div class="visit-time">
                    ${escapeHTML(time)}
                </div>

                <div class="visit-name">
                    ${escapeHTML(visit.patient_name)}
                </div>

                <div class="visit-info">

                    Kartela:
                    ${escapeHTML(
                        visit.card_number || "-"
                    )}

                    <br>

                    ${escapeHTML(
                        visit.visit_type
                    )}

                    ${
                        paymentHTML
                        ? " — " + paymentHTML
                        : ""
                    }

                </div>

                <button
                    class="delete-button"
                    onclick="deleteVisit(${visit.id})"
                >
                    Fshi vizitën
                </button>

            `;


            visitsContainer.appendChild(item);
        }
    );
}


/* =========================================
   FSHi VIZITËN
========================================= */

async function deleteVisit(id){

    const confirmed =
        confirm(
            "Je i sigurt që dëshiron ta fshish këtë vizitë?"
        );


    if(!confirmed){
        return;
    }


    const { error } =
        await supabaseClient
            .from("appointments")
            .delete()
            .eq("id", id);


    if(error){

        console.error(error);

        showMessage(
            "Vizita nuk u fshi.",
            "error"
        );

        return;
    }


    showMessage(
        "Vizita u fshi.",
        "success"
    );


    await loadVisits();
}


/* =========================================
   SIGURIA E TEKSTIT
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   NISJA
========================================= */

displayToday();

createTimeOptions();

loadVisits();

</script>

</body>
</html>
