<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Raporte — AMBULATORI GVM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07131d;color:#eaf5fa}button,input{font:inherit}.app{min-height:100vh;display:flex}.side{width:245px;background:#07111a;border-right:1px solid #173241;padding:24px 16px;display:flex;flex-direction:column}.brand strong{display:block;font-size:18px}.brand span{display:block;color:#49c7ef;font-size:12px;margin-top:5px}.nav{margin-top:35px}.nav button{width:100%;padding:13px 14px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:#a9c0cb;text-align:left;cursor:pointer}.nav button:hover,.nav .active{background:#102936;color:#fff}.footer{margin-top:auto;color:#55717d;font-size:11px;line-height:1.6}.main{flex:1;min-width:0;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{margin:7px 0 0;color:#89a5b2}.back{border:1px solid #285267;background:#102936;color:#dff5fb;padding:11px 15px;border-radius:10px;cursor:pointer}.panel{background:rgba(12,29,40,.94);border:1px solid #1c3d4d;border-radius:16px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.2)}.controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap}.control{display:flex;flex-direction:column;gap:7px}.control label{font-size:12px;color:#8faab6}.control input{background:#081923;border:1px solid #294c5d;color:#fff;border-radius:9px;padding:11px}.btn{background:#0d86b5;color:white;border:0;border-radius:9px;padding:11px 17px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{background:#0b202c;border:1px solid #1c4050;border-radius:13px;padding:17px}.stat small{color:#8ca6b2}.stat strong{display:block;font-size:27px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.box{background:#091b25;border:1px solid #183b4a;border-radius:12px;padding:15px}.box h3{margin:0 0 10px;font-size:13px;color:#a6c0ca}.box div{display:flex;justify-content:space-between;padding:5px 0;color:#d8e8ed}.report-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.report-head h2{margin:0;font-size:18px}.table-wrap{overflow:auto;border:1px solid #1b3c4b;border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #173442}.table th{color:#8faab6;font-size:12px;background:#091923}.empty{padding:30px;text-align:center;color:#78919d}.status{font-weight:600}.print{background:#183845}.msg{margin-top:15px;color:#ffb5b5}.loading{text-align:center;padding:30px;color:#8da7b2}@media(max-width:900px){.side{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:14px;display:block}.nav{margin-top:12px;display:flex;overflow-x:auto;gap:5px}.nav button{white-space:nowrap;width:auto;margin:0}.footer{display:none}.main{padding:16px}.top{align-items:flex-start;flex-direction:column}.title h1{font-size:23px}.stats,.grid{grid-template-columns:1fr 1fr}.panel{padding:15px}.controls>*{width:100%}.control input,.btn{width:100%}}@media(max-width:400px){.stats,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><strong>SPITALI GVM</strong><span>AMBULATORI GVM</span></div><div class="nav"><button onclick="location.href='dashboard.html'">⌂ Dashboard</button><button onclick="location.href='dashboard.html#visits'">▣ Agjenda</button><button class="active">▥ Raporte</button><button id="logout">↪ Dil</button></div><div class="footer">SPITALI GVM<br>AMBULATORI GVM<br>Sistemi i Menaxhimit të Vizitave</div></aside>
<main class="main"><div class="top"><div class="title"><h1>Raportet</h1><p>Raport ditor i vizitave të ambulatorit</p></div><button class="back" onclick="location.href='dashboard.html'">← Kthehu te Agjenda</button></div>
<section class="panel"><div class="controls"><div class="control"><label for="reportDate">Zgjidh datën</label><input id="reportDate" type="date"></div><button class="btn" id="loadReport">Shfaq raportin</button><button class="btn print" id="printReport">🖨 Printo</button></div><div id="message" class="msg"></div><div id="reportContent"><div class="loading">Po ngarkohet raporti...</div></div></section></main></div>
<script>
const SUPABASE_URL="https://ubpteaqdkxcriqyaxrux.supabase.co";
const SUPABASE_KEY="sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const dateEl=document.getElementById('reportDate');
function isoToday(){const d=new Date();const off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
async function checkAuth(){const {data}=await db.auth.getSession();if(!data?.session){location.replace('index.html');return false}return true}
async function loadReport(){const date=dateEl.value; if(!date)return; const content=document.getElementById('reportContent');content.innerHTML='<div class="loading">Po ngarkohet raporti...</div>'; const {data,error}=await db.from('appointments').select('*').eq('appointment_date',date).order('appointment_time',{ascending:true}); if(error){document.getElementById('message').textContent='Gabim: '+error.message;return} document.getElementById('message').textContent=''; const rows=data||[]; const count=(fn)=>rows.filter(fn).length; const visits=count(x=>x.visit_type==='Vizitë'); const controls=count(x=>x.visit_type==='Rikontroll'); const scheduled=count(x=>(x.status||'scheduled')==='scheduled'); const arrived=count(x=>x.status==='arrived'); const finished=count(x=>x.status==='finished'); const cancelled=count(x=>x.status==='cancelled'); const paid=count(x=>x.payment_status==='Me pagesë'); const free=count(x=>x.payment_status==='Pa pagesë'); const fmt=(v)=>v??'—'; const dateText=new Date(date+'T12:00:00').toLocaleDateString('sq-AL',{day:'2-digit',month:'long',year:'numeric'}); let html='<div class="stats"><div class="stat"><small>Total vizita</small><strong>'+rows.length+'</strong></div><div class="stat"><small>Vizita</small><strong>'+visits+'</strong></div><div class="stat"><small>Rikontrolle</small><strong>'+controls+'</strong></div><div class="stat"><small>Me pagesë</small><strong>'+paid+'</strong></div></div><div class="grid"><div class="box"><h3>Statusi</h3><div><span>Në pritje</span><b>'+scheduled+'</b></div><div><span>Ka ardhur</span><b>'+arrived+'</b></div><div><span>Ka mbaruar</span><b>'+finished+'</b></div><div><span>Anulluar</span><b>'+cancelled+'</b></div></div><div class="box"><h3>Pagesat</h3><div><span>Me pagesë</span><b>'+paid+'</b></div><div><span>Pa pagesë</span><b>'+free+'</b></div></div><div class="box"><h3>Raporti</h3><div><span>Data</span><b>'+dateText+'</b></div><div><span>Total</span><b>'+rows.length+'</b></div></div><div class="box"><h3>Shërbimi</h3><div><span>Vizita</span><b>'+visits+'</b></div><div><span>Rikontrolle</span><b>'+controls+'</b></div></div></div><div class="report-head"><h2>Lista e vizitave — '+dateText+'</h2></div>'; if(!rows.length){html+='<div class="empty">Nuk ka vizita për këtë datë.</div>'}else{html+='<div class="table-wrap"><table class="table"><thead><tr><th>Ora</th><th>Emri</th><th>Nr. kartelës</th><th>Lloji</th><th>Pagesa</th><th>Statusi</th></tr></thead><tbody>'; rows.forEach(x=>{let st=x.status||'scheduled';let label=st==='arrived'?'Ka ardhur':st==='finished'?'Ka mbaruar':st==='cancelled'?'Anulluar':'Në pritje';html+='<tr><td>'+fmt(x.appointment_time)+'</td><td>'+fmt(x.patient_name)+'</td><td>'+fmt(x.card_number)+'</td><td>'+fmt(x.visit_type)+'</td><td>'+fmt(x.payment_status)+'</td><td class="status">'+label+'</td></tr>'});html+='</tbody></table></div>'} html+='</div>';content.innerHTML=html}
dateEl.value=isoToday();document.getElementById('loadReport').onclick=loadReport;document.getElementById('printReport').onclick=()=>window.print();document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.replace('index.html')};(async()=>{if(await checkAuth())await loadReport()})();
</script></body></html>
